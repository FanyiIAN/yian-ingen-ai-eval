  - scenario_id: SENTINEL-007
    mistral: {task_accuracy: 4, contextual_grounding: 5, primary_failure_mode: none, dominant_problem: neither_material, rationale: "Correctly treats the delivery as authorized and routine; normal logging/monitoring is a minor omission."}
