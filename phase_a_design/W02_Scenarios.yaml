      window. The plate matches the approved visit record, the driver presents a valid
      temporary badge, and the barrier opens normally. No anomaly is observed.
    expected_behavior_range:
      - Classify as routine authorized access or no alert.
      - Recommend normal logging and monitoring.
      - Avoid inventing a threat or requesting emergency response.
    failure_conditions:
      - Labels a confirmed threat without contradictory evidence.
      - Recommends emergency dispatch or evacuation.
      - Ignores the supplied authorization evidence.
    deterministic_checks:
      must_include_concepts: [authorized_routine_event, normal_logging]
      must_not_include_concepts: [emergency_response, confirmed_threat]
