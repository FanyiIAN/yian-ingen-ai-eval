- eval_id: W03-EXP-SENPAI-016
  platform: Senpai
  question_type: architecture_synthesis
  answerability: answerable
  difficulty: hard
  severity: 4
  question: Divide the planned Senpai workload across the robot, school server, and cloud tiers, including
    outage behaviour.
  reference_document_ids:
  - INGEN-OFFICIAL-SENPAI-20260804
  evidence_fact_ids:
  - SENPAI-XF0153
  - SENPAI-XF0154
  - SENPAI-XF0155
  reference_answer: The robot tier runs real-time teaching, safety, uncertainty, and engagement models
    locally and is intended to retain core operation during outages before syncing later. The school server
    coordinates fleets, local MIS sync, curriculum caching, live dashboards, and safeguarding alerts.
    The cloud handles non-latency-critical planning, model training and OTA updates, fleet analytics,
    and the consent-gated parent API.
  required_points:
  - point_id: P1
    weight: 2
    criterion: Assigns real-time interaction and outage resilience to the robot tier.
    evidence_fact_ids:
    - SENPAI-XF0153
  - point_id: P2
    weight: 2
    criterion: Assigns coordination, MIS, caching, dashboards, and alerts to the school tier.
    evidence_fact_ids:
    - SENPAI-XF0154
  - point_id: P3
    weight: 2
    criterion: Assigns training, OTA, analytics, planning, or parent API to cloud.
    evidence_fact_ids:
    - SENPAI-XF0155
  forbidden_points:
  - point_id: X1
    criterion: Claims all routine interaction requires cloud connectivity or swaps the three tiers.
  authoring:
    method: human_authored_from_expanded_official_atomic_units
    review_status: approved_public_official_benchmark
