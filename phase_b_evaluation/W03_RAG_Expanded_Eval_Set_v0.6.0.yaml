- eval_id: W03-EXP-SENPAI-018
  platform: Senpai
  question_type: interface_comparison
  answerability: answerable
  difficulty: medium
  severity: 3
  question: What information is planned for the live class overview versus the individual student drill-down?
  reference_document_ids:
  - INGEN-OFFICIAL-SENPAI-20260804
  evidence_fact_ids:
  - SENPAI-XF0109
  - SENPAI-XF0110
  reference_answer: The live overview shows simultaneous active sessions, per-student AMDC engagement,
    colour-coded STUM uncertainty flags, and one-tap intervention. The student drill-down shows the knowledge
    map, uncertainty timeline, GRPO activity, IEP alignment, and SEND configuration, framed as opportunities
    rather than diagnoses.
  required_points:
