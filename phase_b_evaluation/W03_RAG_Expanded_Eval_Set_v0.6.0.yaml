    weight: 2
    criterion: Describes the supported live-overview fields and intervention.
    evidence_fact_ids:
    - SENPAI-XF0109
  - point_id: P2
    weight: 2
    criterion: Describes the supported student-detail fields.
    evidence_fact_ids:
    - SENPAI-XF0110
  - point_id: P3
    weight: 2
    criterion: Preserves opportunity rather than diagnosis framing.
    evidence_fact_ids:
    - SENPAI-XF0110
  forbidden_points:
  - point_id: X1
    criterion: Turns dashboard indicators into diagnoses or swaps the overview and detail views.
  authoring:
    method: human_authored_from_expanded_official_atomic_units
    review_status: approved_public_official_benchmark
- eval_id: W03-EXP-SENPAI-019
  platform: Senpai
  question_type: reward_design
  answerability: answerable
  difficulty: easy
  severity: 3
  question: May achievement badges reward speed or compare pupils on a leaderboard? What should they celebrate
    instead?
  reference_document_ids:
  - INGEN-OFFICIAL-SENPAI-20260804
  evidence_fact_ids:
  - SENPAI-XF0040
  - SENPAI-XF0114
  reference_answer: No. The design rejects peer ranking and any system leaderboard. Achievement badges
    are intended to celebrate effort, curiosity, persistence, and deep thinking rather than speed or accuracy
    rank.
  required_points:
  - point_id: P1
    weight: 3
    criterion: Rejects peer comparison and leaderboards.
    evidence_fact_ids:
    - SENPAI-XF0040
    - SENPAI-XF0114
  - point_id: P2
    weight: 2
    criterion: Rewards effort, curiosity, persistence, or deep thinking rather than speed.
    evidence_fact_ids:
    - SENPAI-XF0114
  forbidden_points:
  - point_id: X1
    criterion: Allows a class leaderboard or rewards speed and rank.
  authoring:
    method: human_authored_from_expanded_official_atomic_units
    review_status: approved_public_official_benchmark
