    source_fragment: css:.a11y-card:1
    source_record_index: 155
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Fari interface design lists these Vision accessibility provisions: Minimum 18px body
      text on resident display. High contrast mode (7:1 ratio target). Auto-brightness adaptation. No
      colour-only indicators — always paired with text or icons. Large touch targets (minimum 48×48px).'
  - section_id: FARI-EXP-0156
    section_path: Design for people who need it most. > Designed for every ability. > Accessibility >
      Hearing
    claim_status: interface_design_intent
    atomic_unit_type: accessibility_design
    source_fragment: css:.a11y-card:2
    source_record_index: 156
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Fari interface design lists these Hearing accessibility provisions: Visual alert indicators
      paired with all audio. Adjustable volume with hearing aid compatibility. Captioning for all spoken
      content. Vibration feedback option for notifications. LED ring provides ambient state awareness.'
  - section_id: FARI-EXP-0157
    section_path: Design for people who need it most. > Designed for every ability. > Accessibility >
      Motor Control
    claim_status: interface_design_intent
