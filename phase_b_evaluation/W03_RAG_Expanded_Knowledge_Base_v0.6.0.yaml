    section_id: SENPAI-EXP-0110
    text: 'The Senpai UX specification describes the ''Student detail drill-down'' view as: Per-student
      knowledge map, σ timeline, GRPO activity log, IEP goal alignment, SEND mode configuration. All data
      framed as opportunities, never diagnoses.'
  - fact_id: SENPAI-XF0111
    section_id: SENPAI-EXP-0111
    text: 'The Senpai UX specification describes the ''AI-generated differentiation'' view as: GRPO generates
