  - section_id: FARI-EXP-0118
    section_path: Design for people who need it most. > Six principles that govern every pixel. > UX principles
      > Dignity Before Data
    claim_status: interface_design_intent
    atomic_unit_type: ux_principle
    source_fragment: css:.ux-p:1
    source_record_index: 118
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Fari interface design principle ''Dignity Before Data'' is described as: Every screen
      element is filtered through SEOM Rule F04. No labels that pathologise, no alerts that embarrass.
      Language always uses observation framing — "Fari observed elevated heart rate" not "cardiac event."
      Governance reference: SEOM F04 · Patient Dignity.'
  - section_id: FARI-EXP-0119
    section_path: Design for people who need it most. > Six principles that govern every pixel. > UX principles
