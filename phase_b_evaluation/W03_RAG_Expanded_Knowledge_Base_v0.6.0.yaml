  - fact_id: SENPAI-XF0112
    section_id: SENPAI-EXP-0112
    text: 'The Senpai UX specification describes the ''SEND evidence export'' view as: Auto-formatted
      EHCP/IEP packages. Progress narratives in plain language. MIS export: SIMS, Bromcom, Arbor, iSAMS.
      Ofsted-ready evidence bundles.'
  - fact_id: SENPAI-XF0113
