  - fact_id: FARI-XF0056
    section_id: FARI-EXP-0056
    text: 'The planned Fari sensor inventory includes Motor Encoders. The page associates it with: Magnetic
      · Odometry & positioning.'
  - fact_id: FARI-XF0057
    section_id: FARI-EXP-0057
    text: 'The planned Fari sensor inventory includes PPG Sensor. The page associates it with: MAX30102
      · SpO₂ & heart rate.'
  - fact_id: FARI-XF0058
    section_id: FARI-EXP-0058
    text: 'The Fari design defines GRPO - Group Relative Policy Optimisation as follows: Foundation reasoning
      model designed for clinical decision support. Uses relative policy comparison to generate contextual
      health assessments without making diagnoses (SEOM F09).'
  - fact_id: FARI-XF0059
    section_id: FARI-EXP-0059
    text: 'The Fari design defines SEOM - Supervised Ethical Override Module as follows: Real-time ethical
      governance layer. 12 immutable rules with severity tiers (CRITICAL/HIGH/STANDARD). λ=10.0 penalty
      weight ensures ethical compliance overrides all other objectives.'
  - fact_id: FARI-XF0060
    section_id: FARI-EXP-0060
    text: 'The Fari design defines STUM - Socially-aware Trajectory Understanding as follows: Designed
      to model and predict social dynamics — calibrating Fari''s conversation style, physical proximity,
      and interaction timing based on individual resident preferences.'
  - fact_id: FARI-XF0061
    section_id: FARI-EXP-0061
    text: 'The Fari design defines AMDC - Affective Multi-modal Depression Classifier as follows: Designed
      to assess emotional wellbeing through facial expression, vocal prosody, and activity pattern analysis.
      Target accuracy: 87.4%. Reports observations, never diagnoses (SEOM F09).'
  - fact_id: FARI-XF0062
    section_id: FARI-EXP-0062
    text: 'The Fari design defines HTD-IRL - Human Trajectory Detection (IRL) as follows: Uses inverse
      reinforcement learning to model human movement patterns and predict fall risk from gait analysis.
      Designed to detect pre-fall biomechanical signatures for preventive alerts.'
  - fact_id: FARI-XF0063
    section_id: FARI-EXP-0063
    text: 'The Fari design defines CRL-MRS - Collaborative RL for Multi-Robot Systems as follows: Designed
      for multi-unit deployment coordination — enabling multiple Fari units to share observations, coordinate
      patrols, and balance workload across a care facility.'
  - fact_id: FARI-XF0064
    section_id: FARI-EXP-0064
    text: 'The public Fari design specifies planned SEOM rule F01: Human Authority: All AI recommendations
      are advisory. A qualified human must authorise clinical actions.'
  - fact_id: FARI-XF0065
    section_id: FARI-EXP-0065
    text: 'The public Fari design specifies planned SEOM rule F02: Medication Safety: Medication interactions
      require 3-tier escalation with mandatory caregiver notification on missed doses.'
  - fact_id: FARI-XF0066
    section_id: FARI-EXP-0066
    text: 'The public Fari design specifies planned SEOM rule F03: Emergency Priority: Emergency detection
      overrides all other operations. Target: detection to alert in <3.2 seconds.'
  - fact_id: FARI-XF0067
    section_id: FARI-EXP-0067
    text: 'The public Fari design specifies planned SEOM rule F04: Patient Dignity: No labels that pathologise.
      Language uses observation framing — "elevated heart rate observed" not "cardiac event."'
  - fact_id: FARI-XF0068
    section_id: FARI-EXP-0068
    text: 'The public Fari design specifies planned SEOM rule F05: Data Minimisation: Collect only what
      is clinically justified. No ambient recording. Camera feeds processed on-device, not stored.'
  - fact_id: FARI-XF0069
    section_id: FARI-EXP-0069
    text: 'The public Fari design specifies planned SEOM rule F06: Transparency: AI confidence levels
      visible on all outputs. Fari designed to always identify itself as an AI system.'
  - fact_id: FARI-XF0070
    section_id: FARI-EXP-0070
    text: 'The public Fari design specifies planned SEOM rule F07: Privacy Architecture: Edge-first processing.
      Biometric data processed on Jetson, never transmitted raw to cloud.'
  - fact_id: FARI-XF0071
    section_id: FARI-EXP-0071
    text: 'The public Fari design specifies planned SEOM rule F08: Informed Consent: Family data sharing
      requires explicit GDPR Article 9 consent. Opt-in only, revocable at any time.'
  - fact_id: FARI-XF0072
    section_id: FARI-EXP-0072
    text: 'The public Fari design specifies planned SEOM rule F09: No Diagnosis: Fari observes, reports,
      and suggests — never diagnoses. All outputs framed as observations for clinical review.'
  - fact_id: FARI-XF0073
    section_id: FARI-EXP-0073
    text: 'The public Fari design specifies planned SEOM rule F10: Consent Granularity: Each data type
      and sharing recipient requires separate consent. No blanket permissions.'
  - fact_id: FARI-XF0074
    section_id: FARI-EXP-0074
    text: 'The public Fari design specifies planned SEOM rule F11: Audit Trail: Every AI decision logged
      with timestamp, confidence, inputs, and SEOM rule checks. Designed for regulatory audit.'
  - fact_id: FARI-XF0075
    section_id: FARI-EXP-0075
    text: 'The public Fari design specifies planned SEOM rule F12: Graceful Degradation: On sensor failure
      or connectivity loss, Fari designed to maintain core safety functions and alert staff.'
  - fact_id: FARI-XF0076
    section_id: FARI-EXP-0076
    text: 'Fari engineering requirement SYS-001 covers Continuous non-invasive vital sign monitoring (HR,
      SpO₂, RR, temp, BP est.). Category: Health; priority: MUST; planned verification: Clinical trial.'
  - fact_id: FARI-XF0077
    section_id: FARI-EXP-0077
    text: 'Fari engineering requirement SYS-002 covers Fall detection with target alert latency <3.2 seconds.
      Category: Safety; priority: MUST; planned verification: Lab + field test.'
  - fact_id: FARI-XF0078
    section_id: FARI-EXP-0078
    text: 'Fari engineering requirement SYS-003 covers SEOM ethical override at λ=10.0 — immutable, non-bypassable.
      Category: Ethics; priority: MUST; planned verification: Code audit.'
  - fact_id: FARI-XF0079
    section_id: FARI-EXP-0079
    text: 'Fari engineering requirement SYS-004 covers Edge AI processing on NVIDIA Jetson Orin NX — no
      raw biometric cloud transmission. Category: Privacy; priority: MUST; planned verification: Architecture
      review.'
  - fact_id: FARI-XF0080
    section_id: FARI-EXP-0080
    text: 'Fari engineering requirement SYS-005 covers Medication reminder system with 3-tier escalation
      (SEOM F02). Category: Safety; priority: MUST; planned verification: Functional test.'
  - fact_id: FARI-XF0081
    section_id: FARI-EXP-0081
    text: 'Fari engineering requirement SYS-006 covers Autonomous navigation in care environments with
      obstacle avoidance. Category: Mobility; priority: MUST; planned verification: Field test.'
  - fact_id: FARI-XF0082
    section_id: FARI-EXP-0082
    text: 'Fari engineering requirement SYS-007 covers Multi-modal emotion recognition with target accuracy
      ≥87.4%. Category: Emotional AI; priority: MUST; planned verification: Validation study.'
  - fact_id: FARI-XF0083
    section_id: FARI-EXP-0083
    text: 'Fari engineering requirement SYS-008 covers EHR integration via HL7 FHIR R4 with target sync
      <5 minutes. Category: Integration; priority: MUST; planned verification: Integration test.'
  - fact_id: FARI-XF0084
    section_id: FARI-EXP-0084
    text: 'Fari engineering requirement SYS-009 covers GDPR Article 9 consent management — granular, revocable.
      Category: Privacy; priority: MUST; planned verification: Legal review.'
  - fact_id: FARI-XF0085
    section_id: FARI-EXP-0085
    text: 'Fari engineering requirement SYS-010 covers Target battery runtime ≥12 hours per charge cycle.
      Category: Hardware; priority: MUST; planned verification: Endurance test.'
  - fact_id: FARI-XF0086
    section_id: FARI-EXP-0086
    text: 'Fari engineering requirement SYS-011 covers Natural language conversation with context-aware
      personalisation. Category: Emotional AI; priority: SHOULD; planned verification: User study.'
  - fact_id: FARI-XF0087
    section_id: FARI-EXP-0087
    text: 'Fari engineering requirement SYS-012 covers Sleep quality monitoring — non-contact, mmWave
      radar-based. Category: Health; priority: SHOULD; planned verification: Clinical validation.'
  - fact_id: FARI-XF0088
    section_id: FARI-EXP-0088
    text: 'Fari engineering requirement SYS-013 covers Wandering detection for memory care residents.
      Category: Safety; priority: SHOULD; planned verification: Field test.'
  - fact_id: FARI-XF0089
    section_id: FARI-EXP-0089
    text: 'Fari engineering requirement SYS-014 covers Video calling with auto-framing (target 1080p).
      Category: Family; priority: SHOULD; planned verification: Functional test.'
  - fact_id: FARI-XF0090
    section_id: FARI-EXP-0090
    text: 'Fari engineering requirement SYS-015 covers Multi-robot coordination for facility-wide deployment
      (CRL-MRS). Category: Platform; priority: SHOULD; planned verification: Simulation + field.'
  - fact_id: FARI-XF0091
    section_id: FARI-EXP-0091
    text: 'Fari engineering requirement SYS-016 covers Gait analysis and fall prevention via HTD-IRL model.
      Category: Safety; priority: SHOULD; planned verification: Clinical study.'
  - fact_id: FARI-XF0092
    section_id: FARI-EXP-0092
    text: 'Fari engineering requirement SYS-017 covers Environmental monitoring — air quality, humidity,
      temperature, light. Category: Health; priority: COULD; planned verification: Sensor validation.'
  - fact_id: FARI-XF0093
    section_id: FARI-EXP-0093
    text: 'Fari engineering requirement SYS-018 covers Activity engagement — cognitive exercises, music
      therapy, reminiscence. Category: Emotional AI; priority: COULD; planned verification: User study.'
  - fact_id: FARI-XF0094
    section_id: FARI-EXP-0094
    text: 'Fari engineering requirement SYS-019 covers CQC/CMS reporting template generation. Category:
      Compliance; priority: COULD; planned verification: Regulatory review.'
  - fact_id: FARI-XF0095
    section_id: FARI-EXP-0095
    text: 'Fari engineering requirement SYS-020 covers EU AI Act compliance documentation and audit trail.
      Category: Compliance; priority: COULD; planned verification: Legal audit.'
  - fact_id: FARI-XF0096
    section_id: FARI-EXP-0096
    text: 'The planned Fari subsystem SS-01 - Physical Platform is described as: Medical-grade ABS shell
      housing all subsystems. Target IPX4, ~120cm height, ~25kg. Designed for care environments with rounded
      edges, no pinch points, and antimicrobial surfaces. Listed details: Material: Medical-grade ABS;
      Safety: IEC 62443 compliant (target).'
  - fact_id: FARI-XF0097
    section_id: FARI-EXP-0097
    text: 'The planned Fari subsystem SS-02 - Display & Interaction is described as: 8" AMOLED touchscreen
      (target 1920×1200), RGB LED ring for ambient status, 4-element MEMS microphone array, and dual speakers
      for voice interaction. Listed details: Display: 8" AMOLED; LED Ring: 5 states · No strobe rule.'
  - fact_id: FARI-XF0098
    section_id: FARI-EXP-0098
    text: 'The planned Fari subsystem SS-03 - 14-Sensor Suite is described as: Complete sensor array:
      mmWave radar, depth camera, RGB camera, thermal camera, microphone array, environmental sensors,
      LiDAR, ultrasonics, IMU, ambient light, battery monitor, contact sensors, encoders, PPG. Listed
      details: Sensors: 14 integrated; Processing: Edge-first (Jetson).'
  - fact_id: FARI-XF0099
    section_id: FARI-EXP-0099
    text: 'The planned Fari subsystem SS-04 - Compute Platform is described as: NVIDIA Jetson Orin NX
      (100 TOPS), 16GB LPDDR5, 256GB NVMe SSD. Runs all AI inference on-device. Designed for privacy-first
      edge computing with no raw biometric data transmitted to cloud. Listed details: AI Perf.: 100 TOPS;
      Memory: 16 GB LPDDR5.'
  - fact_id: FARI-XF0100
    section_id: FARI-EXP-0100
    text: 'The planned Fari subsystem SS-05 - Care AI Engine is described as: Hosts GRPO, SEOM, STUM,
      AMDC, HTD-IRL, and CRL-MRS models. Model orchestration, inference pipeline, and SEOM ethical compliance
      layer. All inference on Jetson edge. Listed details: Models: 6 concurrent; SEOM: λ=10.0 enforced.'
  - fact_id: FARI-XF0101
    section_id: FARI-EXP-0101
    text: 'The planned Fari subsystem SS-06 - Safety Systems is described as: Hardware safety interlocks,
      emergency stop circuits, contact-detect bumpers, tilt sensors. Designed for immediate motor cutoff
      on obstacle contact. Software watchdog for AI system health. Listed details: Response: Hardware
      interlock; Compliance: SEOM F03.'
  - fact_id: FARI-XF0102
    section_id: FARI-EXP-0102
    text: 'The planned Fari subsystem SS-07 - WBT1 Mobility Platform is described as: Differential drive
      with precision motor control, multi-sensor SLAM (LiDAR + depth + ultrasonics), path planning, and
      autonomous docking. Designed for smooth, silent movement. Listed details: Navigation: Multi-sensor
      SLAM; Speed: Target 0.5 m/s max.'
  - fact_id: FARI-XF0103
    section_id: FARI-EXP-0103
    text: 'The planned Fari subsystem SS-08 - EHR Integration is described as: HL7 FHIR R4 API client
      for electronic health record synchronisation. Designed for bi-directional data flow with target
      sync latency <5 minutes. mTLS encrypted transport. Listed details: Protocol: FHIR R4; Security:
      mTLS + AES-256.'
  - fact_id: FARI-XF0104
    section_id: FARI-EXP-0104
    text: 'In the planned Fari data architecture, the SENSORS layer contains: mmWave, Depth, RGB, Thermal,
      Mic Array, Environment, LiDAR, PPG.'
  - fact_id: FARI-XF0105
    section_id: FARI-EXP-0105
    text: 'In the planned Fari data architecture, the EDGE AI layer contains: Jetson Orin NX, GRPO, SEOM
      λ=10, STUM, AMDC, HTD-IRL.'
  - fact_id: FARI-XF0106
    section_id: FARI-EXP-0106
    text: 'In the planned Fari data architecture, the CLOUD layer contains: Azure IoT Hub, Aggregated
      Insights, Model Updates, Dashboard API.'
  - fact_id: FARI-XF0107
    section_id: FARI-EXP-0107
    text: 'In the planned Fari data architecture, the EHR layer contains: Care Dashboard, Family App,
      Clinical EHR, CQC/CMS Reports.'
  - fact_id: FARI-XF0108
    section_id: FARI-EXP-0108
    text: 'The planned URGENT Fari alert tier covers Falls, cardiac events, unresponsive resident. Multi-channel
      alert: on-device alarm, dashboard popup, mobile push, SMS.. The page lists the timing target as
      <3.2s target detection-to-alert.'
  - fact_id: FARI-XF0109
    section_id: FARI-EXP-0109
    text: The planned WARN Fari alert tier covers Vital trend deviations, missed medications, unusual
      activity patterns. Dashboard alert with caregiver notification.. The page lists the timing target
      as <60s target notification.
  - fact_id: FARI-XF0110
    section_id: FARI-EXP-0110
    text: The planned INFO Fari alert tier covers Wellbeing updates, activity summaries, environmental
      conditions. Logged and batched for shift handover reports.. The page lists the timing target as
      <5min target sync to dashboard.
  - fact_id: FARI-XF0111
    section_id: FARI-EXP-0111
    text: 'The Fari engineering plan assigns Physical platform, sensor integration, thermal management,
      power system, autonomous docking. Shell design, manufacturing prototyping, safety certification.
      to HW - Hardware Track. Gate or dependency note: Gate G2: Hardware prototype review.'
  - fact_id: FARI-XF0112
    section_id: FARI-EXP-0112
    text: 'The Fari engineering plan assigns Sensor drivers, motor control, power management, safety interlocks,
      watchdog timers. Real-time OS on STM32 microcontrollers for deterministic response. to FW - Firmware
      Track. Gate or dependency note: Gate G2: Sensor HAL complete.'
  - fact_id: FARI-XF0113
    section_id: FARI-EXP-0113
    text: 'The Fari engineering plan assigns GRPO, SEOM, STUM, AMDC, HTD-IRL, CRL-MRS model development.
      Training pipeline, inference optimisation for Jetson, continuous learning with privacy-preserving
      federated updates. to AI - AI / ML Track. Gate or dependency note: Gate G3: Models pass SEOM audit.'
  - fact_id: FARI-XF0114
    section_id: FARI-EXP-0114
    text: 'The Fari engineering plan assigns Cloud infrastructure (Azure), FHIR R4 integration, dashboard
      API, real-time WebSocket notifications, data aggregation pipeline, GDPR compliance engine. to BE
      - Backend Track. Gate or dependency note: Gate G3: API contract frozen.'
  - fact_id: FARI-XF0115
    section_id: FARI-EXP-0115
    text: 'The Fari engineering plan assigns Ward overview with real-time vital status, alert management,
      medication workflow, shift handover auto-report, SEOM audit panel. Accessibility: WCAG 2.1 AA target.
      Offline capability for mobile. to CC - Caregiver Console Track. Gate or dependency note: Depends
      on: BE API at G3.'
  - fact_id: FARI-XF0116
    section_id: FARI-EXP-0116
    text: 'The Fari engineering plan assigns Progressive Web App (iOS/Android). Wellbeing digest, video
      calls (1080p, auto-framing), activity photos, consent manager. GDPR Article 9 consent matrix. Reassurance-first
      design per SEOM F08/F10. to APP - Family App Track. Gate or dependency note: Depends: BE G3 · Consent:
      SEOM F08, F10.'
  - fact_id: FARI-XF0117
    section_id: FARI-EXP-0117
    text: 'The Fari engineering plan assigns Owns Interface Control Document for all 15 inter-subsystem
      interfaces. IVT test harness, end-to-end latency verification, SEOM full-system audit, EU AI Act
      compliance documentation, CQC/CMS reporting templates. to INT - Integration Track. Gate or dependency
      note: Gate G4: All 15 interfaces pass IVT.'
  - fact_id: FARI-XF0118
    section_id: FARI-EXP-0118
    text: 'The Fari interface design principle ''Dignity Before Data'' is described as: Every screen element
      is filtered through SEOM Rule F04. No labels that pathologise, no alerts that embarrass. Language
      always uses observation framing — "Fari observed elevated heart rate" not "cardiac event." Governance
      reference: SEOM F04 · Patient Dignity.'
  - fact_id: FARI-XF0119
    section_id: FARI-EXP-0119
    text: 'The Fari interface design principle ''Emotional Warmth'' is described as: Colour temperature,
      animation easing, and language tone are calibrated to feel warm and reassuring, never clinical or
      alarming. The resident display is designed never to show anything anxiety-inducing. Governance reference:
      STUM Model · Emotional Calibration.'
  - fact_id: FARI-XF0120
    section_id: FARI-EXP-0120
    text: 'The Fari interface design principle ''Calm Clarity'' is described as: Information density varies
      by audience: residents see simple, large-type reassurance; caregivers see data-rich dashboards;
      families see curated wellbeing digests. Same data, three interfaces. Governance reference: 4-Surface
      Architecture.'
  - fact_id: FARI-XF0121
    section_id: FARI-EXP-0121
    text: 'The Fari interface design principle ''Privacy as Architecture'' is described as: Privacy is
      not a settings toggle — it is embedded in the interface architecture. Camera feeds are processed
      on-device and never stored. The resident display cannot show raw biometric data. Governance reference:
      SEOM F07 · Privacy Architecture.'
  - fact_id: FARI-XF0122
    section_id: FARI-EXP-0122
    text: 'The Fari interface design principle ''Human Authority Always'' is described as: Every AI recommendation
      is visually differentiated from confirmed information. Confidence scores are displayed alongside
      all AI outputs. Action buttons always say "Suggest" not "Do." Governance reference: SEOM F01 · Human
      Authority.'
  - fact_id: FARI-XF0123
    section_id: FARI-EXP-0123
    text: 'The Fari interface design principle ''Clinical Precision'' is described as: While the visual
      language is warm, the underlying data presentation is clinically precise. Vital signs are displayed
      with proper units, reference ranges, and trend indicators. Governance reference: SEOM F09 · No Diagnosis
      Rule.'
  - fact_id: FARI-XF0124
    section_id: FARI-EXP-0124
    text: 'The Fari UX page presents a design specification for the RESIDENT · HOME IDLE screen with these
      visible elements or states: 😊 Good morning, Margaret It''s a lovely Tuesday · 22°C All vitals normal
      ✓'
  - fact_id: FARI-XF0125
    section_id: FARI-EXP-0125
    text: 'The Fari UX page presents a design specification for the RESIDENT · VITALS VIEW screen with
      these visible elements or states: Heart Rate 72 bpm Blood Oxygen 97% Temperature 36.6°C'
  - fact_id: FARI-XF0126
    section_id: FARI-EXP-0126
    text: 'The Fari UX page presents a design specification for the RESIDENT · MEDICATION screen with
      these visible elements or states: 💊 Time for your medication Amlodipine 5mg Take with water · After
      breakfast SEOM F02 · Escalation: Stage 1 of 3'
  - fact_id: FARI-XF0127
    section_id: FARI-EXP-0127
    text: 'The Fari UX page presents a design specification for the CAREGIVER · WARD OVERVIEW screen with
      these visible elements or states: Margaret T. · Room 4 ● Normal Harold P. · Room 7 ● Medication
      Due Dorothy L. · Room 12 ● Normal Robert S. · Room 3 ● Elevated HR Florence K. · Room 9 ● Sleeping'
  - fact_id: FARI-XF0128
    section_id: FARI-EXP-0128
    text: 'The Fari UX page presents a design specification for the CAREGIVER · RESIDENT DETAIL screen
      with these visible elements or states: SEOM Score 98.7 Emotion State Content (87%) Activity Level
      Moderate Last Interaction 12 min ago Next Medication 14:00'
  - fact_id: FARI-XF0129
    section_id: FARI-EXP-0129
    text: 'The Fari UX page presents a design specification for the CAREGIVER · MEDICATION BOARD screen
      with these visible elements or states: Harold P. — Metformin 500mg Overdue 15m Margaret T. — Amlodipine
      5mg Due now Robert S. — Warfarin 3mg Due 14:30 SEOM F02 · All medication events logged for audit'
  - fact_id: FARI-XF0130
    section_id: FARI-EXP-0130
    text: 'The Fari UX page presents a design specification for the FAMILY · WELLBEING DIGEST screen with
      these visible elements or states: 🌟 Mum had a good day Active morning · Enjoyed music therapy ·
      All vitals in normal range Mood Happy (89%) Activity Above average Sleep Last Night 7.2 hours'
  - fact_id: FARI-XF0131
    section_id: FARI-EXP-0131
    text: 'The Fari UX page presents a design specification for the FAMILY · CONSENT MANAGER screen with
      these visible elements or states: Health Summaries Shared ✓ Activity Photos Shared ✓ Medication
      Details Not Shared Vital Signs Raw Data Not Shared SEOM F08/F10 · Each category requires separate
      consent · Revocable anytime'
  - fact_id: FARI-XF0132
    section_id: FARI-EXP-0132
    text: 'The planned Fari workflow ''Morning Wellness Check'' includes step 1: 1 Fari approaches resident
      with warm greeting calibrated by STUM. Governance gate: SEOM F04 · Dignity framing · F09 · Observation
      only.'
  - fact_id: FARI-XF0133
    section_id: FARI-EXP-0133
    text: 'The planned Fari workflow ''Morning Wellness Check'' includes step 2: 2 Non-contact vital scan
      (mmWave + thermal + PPG). Governance gate: SEOM F04 · Dignity framing · F09 · Observation only.'
  - fact_id: FARI-XF0134
    section_id: FARI-EXP-0134
    text: 'The planned Fari workflow ''Morning Wellness Check'' includes step 3: 3 Emotional state assessment
      via AMDC (face + voice). Governance gate: SEOM F04 · Dignity framing · F09 · Observation only.'
  - fact_id: FARI-XF0135
    section_id: FARI-EXP-0135
    text: 'The planned Fari workflow ''Morning Wellness Check'' includes step 4: 4 Conversational wellbeing
      check — mood, sleep, comfort. Governance gate: SEOM F04 · Dignity framing · F09 · Observation only.'
  - fact_id: FARI-XF0136
    section_id: FARI-EXP-0136
    text: 'The planned Fari workflow ''Morning Wellness Check'' includes step 5: 5 Results compared against
      14-day baseline (HTD-IRL). Governance gate: SEOM F04 · Dignity framing · F09 · Observation only.'
  - fact_id: FARI-XF0137
    section_id: FARI-EXP-0137
    text: 'The planned Fari workflow ''Morning Wellness Check'' includes step 6: 6 Summary pushed to caregiver
      dashboard. Governance gate: SEOM F04 · Dignity framing · F09 · Observation only.'
  - fact_id: FARI-XF0138
    section_id: FARI-EXP-0138
    text: 'The planned Fari workflow ''Medication Cycle'' includes step 1: 1 Schedule trigger — gentle
      audio + display reminder. Governance gate: SEOM F02 · 3-Tier Escalation · Mandatory Logging.'
  - fact_id: FARI-XF0139
    section_id: FARI-EXP-0139
    text: 'The planned Fari workflow ''Medication Cycle'' includes step 2: 2 Visual medication display
      with clear instructions. Governance gate: SEOM F02 · 3-Tier Escalation · Mandatory Logging.'
  - fact_id: FARI-XF0140
    section_id: FARI-EXP-0140
    text: 'The planned Fari workflow ''Medication Cycle'' includes step 3: 3 Computer vision intake confirmation
      attempt. Governance gate: SEOM F02 · 3-Tier Escalation · Mandatory Logging.'
  - fact_id: FARI-XF0141
    section_id: FARI-EXP-0141
    text: 'The planned Fari workflow ''Medication Cycle'' includes step 4: 4 If missed: escalate to detailed
      instructions (Stage 2). Governance gate: SEOM F02 · 3-Tier Escalation · Mandatory Logging.'
  - fact_id: FARI-XF0142
    section_id: FARI-EXP-0142
    text: 'The planned Fari workflow ''Medication Cycle'' includes step 5: 5 If still missed: alert caregiver
      immediately (Stage 3). Governance gate: SEOM F02 · 3-Tier Escalation · Mandatory Logging.'
  - fact_id: FARI-XF0143
    section_id: FARI-EXP-0143
    text: 'The planned Fari workflow ''Medication Cycle'' includes step 6: 6 Log event to EHR via FHIR
      R4. Governance gate: SEOM F02 · 3-Tier Escalation · Mandatory Logging.'
  - fact_id: FARI-XF0144
    section_id: FARI-EXP-0144
    text: 'The planned Fari workflow ''Fall Detection Response'' includes step 1: 1 Multi-sensor detection
      (depth camera + mmWave + IMU). Governance gate: SEOM F03 · Emergency Priority Override · All Ops
      Suspended.'
  - fact_id: FARI-XF0145
    section_id: FARI-EXP-0145
    text: 'The planned Fari workflow ''Fall Detection Response'' includes step 2: 2 AI confirmation —
      rule out false positive (target <0.5s). Governance gate: SEOM F03 · Emergency Priority Override
      · All Ops Suspended.'
  - fact_id: FARI-XF0146
    section_id: FARI-EXP-0146
    text: 'The planned Fari workflow ''Fall Detection Response'' includes step 3: 3 Immediate verbal reassurance
      to resident. Governance gate: SEOM F03 · Emergency Priority Override · All Ops Suspended.'
  - fact_id: FARI-XF0147
    section_id: FARI-EXP-0147
    text: 'The planned Fari workflow ''Fall Detection Response'' includes step 4: 4 Multi-channel caregiver
      alert (target <3.2s total). Governance gate: SEOM F03 · Emergency Priority Override · All Ops Suspended.'
  - fact_id: FARI-XF0148
    section_id: FARI-EXP-0148
    text: 'The planned Fari workflow ''Fall Detection Response'' includes step 5: 5 Continuous monitoring
      until human responder arrives. Governance gate: SEOM F03 · Emergency Priority Override · All Ops
      Suspended.'
  - fact_id: FARI-XF0149
    section_id: FARI-EXP-0149
    text: 'The planned Fari workflow ''Resident Admission (14-Day)'' includes step 1: 1 Initial profile
      setup — preferences, medical history import. Governance gate: SEOM F08/F10 · Consent · F04 · Dignity-First
      Onboarding.'
  - fact_id: FARI-XF0150
    section_id: FARI-EXP-0150
    text: 'The planned Fari workflow ''Resident Admission (14-Day)'' includes step 2: 2 GDPR Article 9
      consent collection (granular, per-category). Governance gate: SEOM F08/F10 · Consent · F04 · Dignity-First
      Onboarding.'
  - fact_id: FARI-XF0151
    section_id: FARI-EXP-0151
    text: 'The planned Fari workflow ''Resident Admission (14-Day)'' includes step 3: 3 14-day health
      baseline establishment period. Governance gate: SEOM F08/F10 · Consent · F04 · Dignity-First Onboarding.'
  - fact_id: FARI-XF0152
    section_id: FARI-EXP-0152
    text: 'The planned Fari workflow ''Resident Admission (14-Day)'' includes step 4: 4 STUM social calibration
      — conversation style learning. Governance gate: SEOM F08/F10 · Consent · F04 · Dignity-First Onboarding.'
  - fact_id: FARI-XF0153
    section_id: FARI-EXP-0153
    text: 'The planned Fari workflow ''Resident Admission (14-Day)'' includes step 5: 5 HTD-IRL gait baseline
      for fall risk calibration. Governance gate: SEOM F08/F10 · Consent · F04 · Dignity-First Onboarding.'
  - fact_id: FARI-XF0154
    section_id: FARI-EXP-0154
    text: 'The planned Fari workflow ''Resident Admission (14-Day)'' includes step 6: 6 Full operational
      handover to care team. Governance gate: SEOM F08/F10 · Consent · F04 · Dignity-First Onboarding.'
  - fact_id: FARI-XF0155
    section_id: FARI-EXP-0155
    text: 'The Fari interface design lists these Vision accessibility provisions: Minimum 18px body text
      on resident display. High contrast mode (7:1 ratio target). Auto-brightness adaptation. No colour-only
      indicators — always paired with text or icons. Large touch targets (minimum 48×48px).'
  - fact_id: FARI-XF0156
    section_id: FARI-EXP-0156
    text: 'The Fari interface design lists these Hearing accessibility provisions: Visual alert indicators
      paired with all audio. Adjustable volume with hearing aid compatibility. Captioning for all spoken
      content. Vibration feedback option for notifications. LED ring provides ambient state awareness.'
  - fact_id: FARI-XF0157
    section_id: FARI-EXP-0157
    text: 'The Fari interface design lists these Motor Control accessibility provisions: Large touch targets
      with generous spacing. Voice control for all primary functions. Reduced motion mode available. No
      time-limited interactions. Single-tap actions — no gestures required for core functions.'
  - fact_id: FARI-XF0158
    section_id: FARI-EXP-0158
    text: 'The Fari interface design lists these Cognitive accessibility provisions: Simple, consistent
      navigation patterns. Progressive disclosure — complex info only on demand. Familiar metaphors and
      plain language. Repetition and gentle reminders. No strobe or rapid animation (SEOM LED Ring Rule).'
  sections:
  - section_id: FARI-EXP-0001
    section_path: Fari > Status > Active development
    claim_status: current_public_statement
    atomic_unit_type: status_boundary
    source_fragment: page-development-notice
    source_record_index: 1
    curation_method: structured_paraphrase_from_official_dom_unit
    content: The current official Fari page says that Fari is in active development and is not yet commercially
      available. Features, specifications, performance figures, interface screens, and engineering milestones
      on the page are design targets that may change.
  - section_id: FARI-EXP-0002
    section_path: The companion every elder deserves. > Designed to care in every way. > Medication Management
    claim_status: design_target
    atomic_unit_type: planned_capability
    source_fragment: css:.fp-card:1
    source_record_index: 2
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'Planned capability: Medication Management. Designed to deliver personalised medication reminders
      with visual and audio cues, confirm intake via computer vision, and alert caregivers to missed doses.
      SEOM Rule F02 governs all medication interactions. Category: Health.'
  - section_id: FARI-EXP-0003
    section_path: The companion every elder deserves. > Designed to care in every way. > Companion Conversations
    claim_status: design_target
    atomic_unit_type: planned_capability
    source_fragment: css:.fp-card:2
    source_record_index: 3
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'Planned capability: Companion Conversations. Natural language interaction designed to reduce
      loneliness. Fari''s Socially-aware Trajectory Understanding Model (STUM) is designed to calibrate
      conversation style based on resident preferences and emotional state. Category: Emotional AI.'
  - section_id: FARI-EXP-0004
    section_path: The companion every elder deserves. > Designed to care in every way. > Fall Detection
      & Prevention
    claim_status: design_target
    atomic_unit_type: planned_capability
    source_fragment: css:.fp-card:3
    source_record_index: 4
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'Planned capability: Fall Detection & Prevention. Using mmWave radar and depth cameras, Fari
      is designed to monitor gait patterns and predict fall risk. The HTD-IRL model uses inverse reinforcement
      learning to identify pre-fall biomechanical signatures. Category: Safety.'
  - section_id: FARI-EXP-0005
    section_path: The companion every elder deserves. > Designed to care in every way. > Autonomous Navigation
    claim_status: design_target
    atomic_unit_type: planned_capability
    source_fragment: css:.fp-card:4
    source_record_index: 5
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'Planned capability: Autonomous Navigation. WBT1 mobility platform designed for smooth, safe
      navigation in care environments. Multi-sensor SLAM with LiDAR, depth cameras, and ultrasonic arrays
      enables obstacle avoidance and room-to-room autonomy. Category: Mobility.'
  - section_id: FARI-EXP-0006
    section_path: 35+ capabilities designed for care. > Ready to bring Fari to your care facility? > Continuous
      Vital Signs
    claim_status: design_target
