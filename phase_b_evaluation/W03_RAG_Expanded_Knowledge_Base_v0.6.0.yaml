  - fact_id: SENPAI-XF0124
    section_id: SENPAI-EXP-0124
    text: 'For the planned Senpai Mode 02 — Dyslexia (Dyslexia Support) mode, the page specifies Audio-First
      Delivery: All content deliverable primarily through audio to reduce reliance on text reading where
      reading itself is the barrier'
  - fact_id: SENPAI-XF0125
    section_id: SENPAI-EXP-0125
    text: 'For the planned Senpai Mode 02 — Dyslexia (Dyslexia Support) mode, the page specifies Phonics
      Coaching: Spectral audio analysis of pronunciation against age-appropriate reference models — structured
      phonics intervention sequence'
  - fact_id: SENPAI-XF0126
    section_id: SENPAI-EXP-0126
    text: 'For the planned Senpai Mode 02 — Dyslexia (Dyslexia Support) mode, the page specifies Zero
      Pace Pressure: GRPO model pace weight configurable to zero — Senpai never conveys urgency or time
      pressure in dyslexia mode'
  - fact_id: SENPAI-XF0127
    section_id: SENPAI-EXP-0127
    text: 'For the planned Senpai Mode 03 — ADHD (ADHD & Attention) mode, the page specifies Micro-Session
      Design: 5–7 minute learning units with planned movement breaks — matched to typical attention span
      ranges for different age bands'
  - fact_id: SENPAI-XF0128
    section_id: SENPAI-EXP-0128
    text: 'For the planned Senpai Mode 03 — ADHD (ADHD & Attention) mode, the page specifies Novelty Sequencing:
      High-novelty content ordering designed to sustain engagement — modality switches planned before
      the student''s attention would naturally drop'
  - fact_id: SENPAI-XF0129
    section_id: SENPAI-EXP-0129
    text: 'For the planned Senpai Mode 03 — ADHD (ADHD & Attention) mode, the page specifies Visual Timer:
      Projected countdown visible on surface — designed to build time awareness without creating anxiety'
  - fact_id: SENPAI-XF0130
    section_id: SENPAI-EXP-0130
    text: 'For the planned Senpai Mode 03 — ADHD (ADHD & Attention) mode, the page specifies Distraction
      Reduction: Minimal display mode reduces visual clutter on Senpai''s face and body during focus periods'
  - fact_id: SENPAI-XF0131
    section_id: SENPAI-EXP-0131
    text: 'For the planned Senpai Mode 03 — ADHD (ADHD & Attention) mode, the page specifies Context Thread:
      Break integration designed to preserve the learning thread — Senpai resumes exactly where the student
      left off, with a brief contextual reminder'
  - fact_id: SENPAI-XF0132
    section_id: SENPAI-EXP-0132
    text: 'For the planned Senpai Mode 04 — Visual Impairment (VI Adaptation) mode, the page specifies
      Screen Reader Integration: All display content read aloud automatically — no separate assistive
      technology required'
  - fact_id: SENPAI-XF0133
    section_id: SENPAI-EXP-0133
    text: 'For the planned Senpai Mode 04 — Visual Impairment (VI Adaptation) mode, the page specifies
      High Contrast Display: Up to 72pt font, maximum contrast mode available across all content areas'
  - fact_id: SENPAI-XF0134
    section_id: SENPAI-EXP-0134
    text: 'For the planned Senpai Mode 04 — Visual Impairment (VI Adaptation) mode, the page specifies
      Tactile Materials: STL files generated for 3D-printable tactile learning objects aligned to current
      lesson content'
  - fact_id: SENPAI-XF0135
    section_id: SENPAI-EXP-0135
    text: 'For the planned Senpai Mode 04 — Visual Impairment (VI Adaptation) mode, the page specifies
      Braille Display: Bluetooth connection to refreshable braille display devices — all text content
      routed on request'
  - fact_id: SENPAI-XF0136
    section_id: SENPAI-EXP-0136
    text: 'For the planned Senpai Mode 04 — Visual Impairment (VI Adaptation) mode, the page specifies
      Spatial Orientation: WBT1 mobility base designed to narrate spatial environment — classroom layout,
      object positions, route guidance'
  - fact_id: SENPAI-XF0137
    section_id: SENPAI-EXP-0137
    text: 'For the planned Senpai Mode 05 — Hearing Impairment (HI Adaptation) mode, the page specifies
      Direct Audio Streaming: Bluetooth LE Audio direct streaming to hearing aids via Auracast — no intermediary
      device required'
  - fact_id: SENPAI-XF0138
    section_id: SENPAI-EXP-0138
    text: 'For the planned Senpai Mode 05 — Hearing Impairment (HI Adaptation) mode, the page specifies
      Real-Time Captions: All Senpai speech captioned and displayed — adjustable in size, position, and
      contrast'
  - fact_id: SENPAI-XF0139
    section_id: SENPAI-EXP-0139
    text: 'For the planned Senpai Mode 05 — Hearing Impairment (HI Adaptation) mode, the page specifies
      Sign Language Avatar: Animated signing avatar designed to support BSL, ASL, ISL, NZSL, and Auslan'
  - fact_id: SENPAI-XF0140
    section_id: SENPAI-EXP-0140
    text: 'For the planned Senpai Mode 05 — Hearing Impairment (HI Adaptation) mode, the page specifies
      Makaton Symbols: Symbol accompaniment on key vocabulary items — displayed alongside spoken and written
      content'
  - fact_id: SENPAI-XF0141
    section_id: SENPAI-EXP-0141
    text: 'For the planned Senpai Mode 05 — Hearing Impairment (HI Adaptation) mode, the page specifies
      Vibrotactile Link: Bluetooth vibrotactile pad for music rhythm learning and tactile audio reinforcement'
  - fact_id: SENPAI-XF0142
    section_id: SENPAI-EXP-0142
    text: 'For the planned Senpai Mode 06 — Physical Disability (Motor Impairment) mode, the page specifies
      Eye-Gaze Control: Full curriculum navigation via 120fps IR gaze tracking — designed for hands-free
      operation of all Senpai functions'
  - fact_id: SENPAI-XF0143
    section_id: SENPAI-EXP-0143
    text: 'For the planned Senpai Mode 06 — Physical Disability (Motor Impairment) mode, the page specifies
      Switch Access: 1-switch and 2-switch scanning modes — compatible with AbleNet and Adaptivation switch
      devices'
  - fact_id: SENPAI-XF0144
    section_id: SENPAI-EXP-0144
    text: 'For the planned Senpai Mode 06 — Physical Disability (Motor Impairment) mode, the page specifies
      Voice Control: Designed to accommodate atypical and dysarthric speech patterns — not trained on
      neurotypical speech alone'
  - fact_id: SENPAI-XF0145
    section_id: SENPAI-EXP-0145
    text: 'For the planned Senpai Mode 06 — Physical Disability (Motor Impairment) mode, the page specifies
      Dwell Selection: No click required — dwell-to-select with accidental-selection reversal and configurable
      dwell time'
  - fact_id: SENPAI-XF0146
    section_id: SENPAI-EXP-0146
    text: 'For the planned Senpai Mode 06 — Physical Disability (Motor Impairment) mode, the page specifies
      Wheelchair Compatible: Height-adjustable mount designed for wheelchair tray compatibility — all
      interaction reachable from seated position'
  - fact_id: SENPAI-XF0147
    section_id: SENPAI-EXP-0147
    text: 'The Senpai interface principle ''Joy Before Data'' is described as: The student-facing display
      is never a dashboard. It is a companion interface built on the principle that emotional engagement
      precedes cognitive engagement. GRPO''s reward function includes a joy component (w_affect) precisely
      for this reason. The interface must never show rankings, scores, or phrases like "incorrect" — only
      "interesting, let''s explore that." Governance reference: SEOM E03 · E07 — no rankings, no "incorrect".'
  - fact_id: SENPAI-XF0148
    section_id: SENPAI-EXP-0148
    text: 'The Senpai interface principle ''Intelligence, Not Instruction'' is described as: Senpai doesn''t
      follow a script — it navigates a knowledge graph. GRPO''s teaching policy selects the next optimal
      concept based on mastery, engagement, and learning style. STUM''s engagement uncertainty (σ_total)
      detects pseudo-mastery — the student who pattern-matches correct answers without genuine understanding.
      Teachers see σ; students never do. Governance reference: STUM σ visible to teachers, never to students.'
  - fact_id: SENPAI-XF0149
    section_id: SENPAI-EXP-0149
    text: 'The Senpai interface principle ''SEND as Architecture'' is described as: SEND is not a feature
      or an accessibility patch. It is a design dimension running through every hardware and software
      decision. The 6 SEND modes are full interface reorganisations, not overlays — co-developed with
      educational psychologists and parent advocacy groups. SEOM E11 prohibits any language implying special
      treatment. Governance reference: SEOM E11 — all adaptations = "preferred learning style".'
  - fact_id: SENPAI-XF0150
    section_id: SENPAI-EXP-0150
    text: 'The Senpai interface principle ''Teacher Authority Always'' is described as: Senpai amplifies
      the teacher — it never replaces them. SEOM E10 requires immediate deference to teacher instructions.
      Dashboard insights are always framed as opportunities ("3 students may benefit from revisiting fractions")
      — never as diagnoses. Senpai''s suggestions are always labelled as suggestions with one-tap teacher
      override. Governance reference: SEOM E10 — immediate deference to teacher instruction.'
  - fact_id: SENPAI-XF0151
    section_id: SENPAI-EXP-0151
    text: 'The Senpai interface principle ''Child Safety as Architecture'' is described as: COPPA, GDPR-K,
      UK Children''s Code — designed as training-level constraints, not runtime filters. Gaze data deleted
      on session end. No biometric profiles. The UI makes privacy state visible to teachers at all times.
      SEOM E12 (safeguarding disclosure) triggers a full-screen teacher-only alert. Students are never
      aware this has occurred. Governance reference: SEOM E12 — highest priority rule, full-screen teacher
      alert.'
  - fact_id: SENPAI-XF0152
    section_id: SENPAI-EXP-0152
    text: 'The Senpai interface principle ''Evidence by Default'' is described as: Ofsted inspections,
      EHCP Annual Reviews, IEP documentation, parent progress reports — all designed to be automatically
      generated from session data. The UI treats evidence generation as a first-class user journey. SEND
      evidence exports formatted for EHCP/IEP documentation and compatible with SIMS, Bromcom, and Arbor
      MIS systems. Governance reference: EHCP/IEP · SIMS · Bromcom · Arbor · Ofsted-ready.'
  - fact_id: SENPAI-XF0153
    section_id: SENPAI-EXP-0153
    text: 'The planned Senpai architecture defines Tier 1 · On Robot - Edge Compute — Real-Time Student
      Interaction as: Core models on-device GRPO (teaching policy), SEOM (child safety), STUM (uncertainty),
      AMDC (engagement sensing) — all running locally on NVIDIA Jetson Orin Nano 8 GB at target <100 ms
      inference latency. Handles 80% of all routine interactions without network dependency. Offline capability
      target Core functionality designed to operate for 72 hours without cloud connectivity. Student progress
      synchronises automatically when connectivity restores. Designed for rural deployments and network
      outage resilience. Interaction loop target Student input → AMDC engagement detection → SEOM safety
      check (λ=4.0/5.0) → GRPO policy decision → response generation → display + projector + audio output.
      Target latency: <100 ms end-to-end.'
  - fact_id: SENPAI-XF0154
    section_id: SENPAI-EXP-0154
    text: 'The planned Senpai architecture defines Tier 2 · Classroom / School Server - Local Gateway
      — Coordination, MIS Sync, Analytics as: Fleet coordination Intel NUC or equivalent school server.
      Coordinates 10–30 Senpai units via CRL-MRS. Manages MIS synchronisation with SIMS, Bromcom, Arbor.
      Caches curriculum content for offline operation. Network requirement 1 Gbps LAN (minimum). 100 Mbps
      WAN uplink. Each Senpai streams 3–5 Mbps projector output to local server for teacher monitoring.
      30-unit classroom: 90–150 Mbps aggregate. Wi-Fi 6 (802.11ax, MU-MIMO) or wired Ethernet required.
      Teacher dashboard Handles all teacher dashboard requests locally — live class engagement, STUM flags,
      safeguarding alerts (SEOM E12). Low-latency dashboard updates via WebSocket. MIS export queued for
      cloud sync.'
  - fact_id: SENPAI-XF0155
    section_id: SENPAI-EXP-0155
    text: 'The planned Senpai architecture defines Tier 3 · Cloud (AWS eu-west-2 primary / us-east-1 secondary)
      - Cloud Infrastructure — Fleet Analytics, Model Training, Parent App as: HTD-IRL serving Cloud-hosted
      lesson planning model. Non-latency-critical; called for new curriculum plans. GRPO training Policy
      updates trained on aggregated anonymised interaction data. OTA deployment. Parent app API REST API
      for parent app (consent-gated). Progress summaries, activity suggestions, data controls. OTA firmware
      Over-the-air updates. Delta packages minimise bandwidth. Scheduled during off-hours.'
  - fact_id: SENPAI-XF0156
    section_id: SENPAI-EXP-0156
    text: 'The Senpai page presents this core concept: 01 Adaptive Intelligence An AI that models what
      each child understands right now — not last term. Most educational software delivers the same content
      at the same pace to every student. Senpai is being built around a different principle: that genuine
      learning requires knowing where a child''s understanding actually is, moment to moment. Our Origami
      AI platform is being designed to maintain a live model of each student''s knowledge state, distinguishing
      between concepts that are genuinely mastered and those that have been pattern-matched without real
      comprehension. When a child gives a correct answer, the system is designed to decide whether that
      reflects real understanding — by what they said, how long they took, whether a transfer question
      can be answered. When it cannot, the next activity adapts accordingly. In Development Origami AI
      PIC 2.0 8,000+ Concept Knowledge Graph'
  - fact_id: SENPAI-XF0157
    section_id: SENPAI-EXP-0157
    text: 'The Senpai page presents this core concept: 02 Inclusive from First Principles Designed for
      every learner — including the one in five who has a special educational need. SEND (Special Educational
      Needs and Disabilities) is not a feature layer added on top of Senpai''s design. It is a primary
      design constraint that has shaped the hardware, the AI training objectives, and the curriculum framework
      from the beginning. We are developing six distinct adaptation modes — covering Autism Spectrum,
      Dyslexia, ADHD, Visual Impairment, Hearing Impairment, and Physical Disability — each representing
      a coherent set of interaction design decisions, not a checklist of accessibility fixes. We believe
      inclusion and commercial scale are not in tension — they are the same opportunity. In Development
      6 SEND Adaptation Modes UN CRPD · UK SEND CoP · IDEA (US)'
  - fact_id: SENPAI-XF0158
    section_id: SENPAI-EXP-0158
    text: 'The Senpai page presents this core concept: 03 Physical Presence A robot children can see,
      talk to, and grow alongside — not another screen. Research in developmental psychology consistently
      shows that children form stronger, more durable learning relationships with physical companions
      than with screens. Senpai is a physical robot. It is designed to express emotion through facial
      movement, body language, and voice — using Disney''s 12 Principles of Animation as a guiding framework
      for every expression and gesture. Its 10.1″ AMOLED display serves as a dynamic face. Its 720p projector
      casts interactive content onto any nearby surface — turning a table, a floor, or a wall into a learning
      environment. The result is designed to feel less like software and more like a presence. In Development
      Disney 12 Animation Principles 720p Interactive Projector AMOLED 10.1″'
  - fact_id: SENPAI-XF0159
    section_id: SENPAI-EXP-0159
    text: 'The planned Senpai interaction design includes 10.1″ AMOLED: 120Hz · 1920×1200'
  - fact_id: SENPAI-XF0160
    section_id: SENPAI-EXP-0160
    text: 'The planned Senpai interaction design includes 720p Projector: 100″ touch surface'
  - fact_id: SENPAI-XF0161
    section_id: SENPAI-EXP-0161
    text: 'The planned Senpai interaction design includes 100 TOPS AI: Jetson Orin NX'
  - fact_id: SENPAI-XF0162
    section_id: SENPAI-EXP-0162
    text: 'The planned Senpai interaction design includes 40+ Languages: Pronunciation coaching'
  - fact_id: SENPAI-XF0163
    section_id: SENPAI-EXP-0163
    text: 'The planned Senpai interaction design includes 6 SEND Modes: Inclusive by design'
  - fact_id: SENPAI-XF0164
    section_id: SENPAI-EXP-0164
    text: 'The planned Senpai interaction design includes 12 Safety Rules: SEOM · λ=4.0'
  - fact_id: SENPAI-XF0165
    section_id: SENPAI-EXP-0165
    text: 'The planned Senpai interaction design includes Origami AI: PIC 2.0 platform'
  - fact_id: SENPAI-XF0166
    section_id: SENPAI-EXP-0166
    text: 'The Senpai UX page presents a design specification for the SENPAI · IDLE / PERSONA SCREEN screen
      with these elements or states: 😊 Hi! I''m Senpai! Ready to learn something amazing? 📐 Maths 📖 English
      🔬 Science'
  - fact_id: SENPAI-XF0167
    section_id: SENPAI-EXP-0167
    text: 'The Senpai UX page presents a design specification for the GRPO ADAPTIVE · ACTIVE screen with
      these elements or states: ← Maths · Fractions · Year 5 · KS2 What is ½ + ¼ ? ²⁄₄ ¾ ✓ ⅗ 1 Q4/12 ·
      ⭐⭐⭐ · Engaged'
  - fact_id: SENPAI-XF0168
    section_id: SENPAI-EXP-0168
    text: 'The Senpai UX page presents a design specification for the ASSESSMENT · TIMED · 15:00 screen
      with these elements or states: Fractions — Unit Assessment · Q7/12 · KS2 A recipe needs ¾ cup of
      flour. You only have a ⅓ cup measure. How many scoops? Type your answer...'
  - fact_id: SENPAI-XF0169
    section_id: SENPAI-EXP-0169
    text: 'The Senpai UX page presents a design specification for the SEL CHECK-IN · SEOM E12 ACTIVE screen
      with these elements or states: 💭 How are you feeling today? 😄 Great! 🙂 Good 😐 Okay 😕 Not great 😢
      Sad Your feelings are private · SEOM safeguarding active'
  - fact_id: SENPAI-XF0170
    section_id: SENPAI-EXP-0170
    text: 'The Senpai UX page presents a design specification for the TEACHER DASHBOARD · YEAR 5 · MATHS
      · LIVE screen with these elements or states: ENGAGED (22) · NEEDS HELP (4) · ALERT (2) 😊 A.Smith
      94% Q7 😕 C.Patel 62% ⚠ Q4 😄 B.Jones 91% Q9 🔴 D.Lee ALERT'
  sections:
  - section_id: SENPAI-EXP-0001
    section_path: Senpai > Status > Active development
    claim_status: current_public_statement
    atomic_unit_type: status_boundary
    source_fragment: page-development-notice
    source_record_index: 1
    curation_method: structured_paraphrase_from_official_dom_unit
    content: The current official Senpai page presents the product, hardware, AI stack, workflows, compliance
      approach, and interface screens as design materials for a system in development. These descriptions
      do not by themselves establish validated deployment or certification.
  - section_id: SENPAI-EXP-0002
    section_path: Senpai — the companion that grows with every child. > Grounded in 30 years of learning
      science . > 8,000+ concept knowledge graph across all subjects
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:1
    source_record_index: 2
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''8,000+ concept knowledge graph across all subjects'' as: Every
      learning interaction is designed to map to a subject-specific knowledge graph — a directed acyclic
      graph where nodes represent concepts and edges represent prerequisite relationships. Senpai is intended
      to navigate this graph based on demonstrated mastery and spaced retrieval scheduling, ensuring each
      child works at their genuine frontier rather than their comfortable plateau. Context label: Knowledge
      Architecture. Page labels: IB · Cambridge · CBSE, UK NC KS1–KS5, US Common Core, Singapore MOE.'
  - section_id: SENPAI-EXP-0003
    section_path: Senpai — the companion that grows with every child. > Grounded in 30 years of learning
      science . > Ebbinghaus forgetting curve scheduling for every concept
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:2
    source_record_index: 3
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Ebbinghaus forgetting curve scheduling for every concept'' as:
      Senpai is designed to track every concept a student has encountered and schedule retrieval at intervals
      derived from the Ebbinghaus forgetting curve — 1 day, 3 days, 1 week, 2 weeks, 1 month, and 3 months
      — calibrated for child developmental stages across early years, primary, and secondary age bands.
      Context label: Spaced Retrieval.'
  - section_id: SENPAI-EXP-0004
    section_path: Senpai — the companion that grows with every child. > Grounded in 30 years of learning
      science . > Four assessment types embedded in a single system
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:3
    source_record_index: 4
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Four assessment types embedded in a single system'' as: Formative
      (embedded, low-stakes, immediate feedback), summative (end-of-unit structured), diagnostic (entry
      assessment for new and transferred students), and spaced retrieval assessments — designed to feed
      into the teacher dashboard and MIS integration layer without adding assessment burden to teachers.
      Context label: Assessment Design. Page labels: SIMS · Bromcom · Arbor · iSAMS.'
  - section_id: SENPAI-EXP-0005
    section_path: Senpai — the companion that grows with every child. > Grounded in 30 years of learning
      science . > Distinguishing genuine mastery from pattern-matching
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:4
    source_record_index: 5
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Distinguishing genuine mastery from pattern-matching'' as: One
      of the most persistent problems in EdTech is pseudo-mastery — when a student answers correctly by
      recognising a pattern rather than understanding a concept. Senpai''s STUM model is designed to detect
      this pattern and respond with transfer questions that require applying the concept to a new context,
      revealing whether understanding is genuine. Context label: Engagement Detection.'
  - section_id: SENPAI-EXP-0006
    section_path: Senpai — the companion that grows with every child. > Grounded in 30 years of learning
      science . > Six ways to teach the same concept, chosen adaptively
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:5
    source_record_index: 6
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Six ways to teach the same concept, chosen adaptively'' as:
      Dialogue, visual (display and projector), kinaesthetic (gesture and surface interaction), narrative
      (story-embedded), musical (for early years numeracy and language), and physical (movement-based
      with optional mobility base). The system is designed to switch modality when a student plateaus
      on a concept — rather than simply repeating the same approach more slowly. Context label: Delivery
      Modalities.'
  - section_id: SENPAI-EXP-0007
    section_path: Senpai — the companion that grows with every child. > Grounded in 30 years of learning
      science . > Designed around effort, curiosity, and resilience — not speed
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:6
    source_record_index: 7
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Designed around effort, curiosity, and resilience — not speed''
      as: Senpai''s reward system is designed around CASEL''s social-emotional learning framework — celebrating
      persistence, intellectual curiosity, and the courage to attempt difficult problems. No leaderboards,
      no time pressure, no comparison against classmates. The only benchmark is the student''s own previous
      performance. Context label: Reward Architecture. Page labels: CASEL SEL Framework.'
  - section_id: SENPAI-EXP-0008
    section_path: Senpai — the companion that grows with every child. > Three surfaces. Three perspectives
      . > Classroom Intelligence Platform
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:7
    source_record_index: 8
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Classroom Intelligence Platform'' as: Designed to tell teachers
      what each student needs before they need to ask — not after the lesson has already moved on. The
      teacher dashboard is intended to be a teaching support tool, not a reporting burden. Context label:
      Dashboard 01 · Teacher.'
  - section_id: SENPAI-EXP-0009
    section_path: Senpai — the companion that grows with every child. > Three surfaces. Three perspectives
      . > Learning Adventure
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:8
    source_record_index: 9
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Learning Adventure'' as: Designed around Self-Determination
      Theory — autonomy, competence, and relatedness. No grades visible to the student. No ranking against
      classmates. Only a map of their own growing understanding. Context label: Dashboard 02 · Student.'
  - section_id: SENPAI-EXP-0010
    section_path: Senpai — the companion that grows with every child. > Three surfaces. Three perspectives
      . > Transparent Progress Window
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:9
    source_record_index: 10
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''Transparent Progress Window'' as: Designed to give parents meaningful
      insight into their child''s learning without education jargon, and meaningful control over how their
      child''s data is used. Context label: Dashboard 03 · Parent · 40+ Languages.'
  - section_id: SENPAI-EXP-0011
    section_path: Every learner deserves a great teacher. > Designed for global compliance from first
      principles . > UK SEND Code of Practice 2015
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:10
    source_record_index: 11
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''UK SEND Code of Practice 2015'' as: IEP and EHCP evidence package
      generation. SEND qualification requirements for special schools. UK Safeguarding Code requirements
      embedded in SEOM E01/E12. Context label: United Kingdom.'
  - section_id: SENPAI-EXP-0012
    section_path: Every learner deserves a great teacher. > Designed for global compliance from first
      principles . > IDEA & FERPA & COPPA
    claim_status: design_target
    atomic_unit_type: design_card
    source_fragment: css:.card:11
    source_record_index: 12
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai page describes ''IDEA & FERPA & COPPA'' as: Individuals with Disabilities Education
      Act alignment. FERPA student record protections. COPPA under-13 data consent requirements embedded
      in SEOM E06. Context label: United States.'
  - section_id: SENPAI-EXP-0013
    section_path: Every learner deserves a great teacher. > Designed for global compliance from first
      principles . > GDPR-K & UK GDPR
