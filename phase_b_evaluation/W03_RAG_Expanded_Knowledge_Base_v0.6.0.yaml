  - fact_id: HOME-XF0002
    section_id: HOME-EXP-0002
    text: The homepage describes Origami AI as a shared, hardware-agnostic, edge-oriented intelligence
      layer across the product ecosystem. It qualifies cross-product capability descriptions as forward-looking
      design intent because products are at different development stages.
  - fact_id: HOME-XF0003
    section_id: HOME-EXP-0003
    text: The homepage presents Fari and Senpai within an early foundation phase using tabletop or companion
      form factors, while mobile and humanoid systems appear in later phases with greater physical complexity.
      This is roadmap context rather than a verified implementation matrix.
