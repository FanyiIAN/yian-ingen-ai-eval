  - fact_id: SENPAI-XF0104
    section_id: SENPAI-EXP-0104
    text: 'The Senpai engineering plan defines Phase 4, ''Implementation'', as: 7 parallel tracks: Hardware
      manufacture · Firmware (edge AI, sensor drivers) · AI training (6 models) · Backend (REST APIs)
