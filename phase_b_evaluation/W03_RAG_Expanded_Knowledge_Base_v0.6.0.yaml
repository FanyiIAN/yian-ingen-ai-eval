  - section_id: SENPAI-EXP-0147
    section_path: Design system, screen layouts, interactions . > Senpai serves four audiences simultaneously
      — and every design decision serves all four. > Design principles > Joy Before Data
    claim_status: interface_design_intent
    atomic_unit_type: design_principle
    source_fragment: css:.principle-card:1
    source_record_index: 147
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai interface principle ''Joy Before Data'' is described as: The student-facing display
      is never a dashboard. It is a companion interface built on the principle that emotional engagement
      precedes cognitive engagement. GRPO''s reward function includes a joy component (w_affect) precisely
      for this reason. The interface must never show rankings, scores, or phrases like "incorrect" — only
      "interesting, let''s explore that." Governance reference: SEOM E03 · E07 — no rankings, no "incorrect".'
  - section_id: SENPAI-EXP-0148
    section_path: Design system, screen layouts, interactions . > Senpai serves four audiences simultaneously
      — and every design decision serves all four. > Design principles > Intelligence, Not Instruction
    claim_status: interface_design_intent
    atomic_unit_type: design_principle
    source_fragment: css:.principle-card:2
    source_record_index: 148
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai interface principle ''Intelligence, Not Instruction'' is described as: Senpai
      doesn''t follow a script — it navigates a knowledge graph. GRPO''s teaching policy selects the next
      optimal concept based on mastery, engagement, and learning style. STUM''s engagement uncertainty
      (σ_total) detects pseudo-mastery — the student who pattern-matches correct answers without genuine
      understanding. Teachers see σ; students never do. Governance reference: STUM σ visible to teachers,
      never to students.'
  - section_id: SENPAI-EXP-0149
    section_path: Design system, screen layouts, interactions . > Senpai serves four audiences simultaneously
      — and every design decision serves all four. > Design principles > SEND as Architecture
    claim_status: interface_design_intent
    atomic_unit_type: design_principle
    source_fragment: css:.principle-card:3
    source_record_index: 149
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai interface principle ''SEND as Architecture'' is described as: SEND is not a feature
      or an accessibility patch. It is a design dimension running through every hardware and software
      decision. The 6 SEND modes are full interface reorganisations, not overlays — co-developed with
      educational psychologists and parent advocacy groups. SEOM E11 prohibits any language implying special
      treatment. Governance reference: SEOM E11 — all adaptations = "preferred learning style".'
  - section_id: SENPAI-EXP-0150
    section_path: Design system, screen layouts, interactions . > Senpai serves four audiences simultaneously
      — and every design decision serves all four. > Design principles > Teacher Authority Always
    claim_status: interface_design_intent
    atomic_unit_type: design_principle
    source_fragment: css:.principle-card:4
    source_record_index: 150
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai interface principle ''Teacher Authority Always'' is described as: Senpai amplifies
      the teacher — it never replaces them. SEOM E10 requires immediate deference to teacher instructions.
      Dashboard insights are always framed as opportunities ("3 students may benefit from revisiting fractions")
      — never as diagnoses. Senpai''s suggestions are always labelled as suggestions with one-tap teacher
      override. Governance reference: SEOM E10 — immediate deference to teacher instruction.'
  - section_id: SENPAI-EXP-0151
    section_path: Design system, screen layouts, interactions . > Senpai serves four audiences simultaneously
      — and every design decision serves all four. > Design principles > Child Safety as Architecture
    claim_status: interface_design_intent
    atomic_unit_type: design_principle
    source_fragment: css:.principle-card:5
    source_record_index: 151
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai interface principle ''Child Safety as Architecture'' is described as: COPPA,
      GDPR-K, UK Children''s Code — designed as training-level constraints, not runtime filters. Gaze
      data deleted on session end. No biometric profiles. The UI makes privacy state visible to teachers
      at all times. SEOM E12 (safeguarding disclosure) triggers a full-screen teacher-only alert. Students
      are never aware this has occurred. Governance reference: SEOM E12 — highest priority rule, full-screen
      teacher alert.'
  - section_id: SENPAI-EXP-0152
    section_path: Design system, screen layouts, interactions . > Senpai serves four audiences simultaneously
      — and every design decision serves all four. > Design principles > Evidence by Default
    claim_status: interface_design_intent
    atomic_unit_type: design_principle
    source_fragment: css:.principle-card:6
    source_record_index: 152
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The Senpai interface principle ''Evidence by Default'' is described as: Ofsted inspections,
      EHCP Annual Reviews, IEP documentation, parent progress reports — all designed to be automatically
      generated from session data. The UI treats evidence generation as a first-class user journey. SEND
      evidence exports formatted for EHCP/IEP documentation and compatible with SIMS, Bromcom, and Arbor
      MIS systems. Governance reference: EHCP/IEP · SIMS · Bromcom · Arbor · Ofsted-ready.'
  - section_id: SENPAI-EXP-0153
    section_path: Hardware, AI stack, and architecture in full. > Edge · School · Cloud — designed for
      resilience . > Architecture > Tier 1 · On Robot - Edge Compute — Real-Time Student Interaction
    claim_status: architecture_design_intent
    atomic_unit_type: architecture_tier
    source_fragment: css:.arch-tier:1
    source_record_index: 153
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The planned Senpai architecture defines Tier 1 · On Robot - Edge Compute — Real-Time Student
      Interaction as: Core models on-device GRPO (teaching policy), SEOM (child safety), STUM (uncertainty),
      AMDC (engagement sensing) — all running locally on NVIDIA Jetson Orin Nano 8 GB at target <100 ms
      inference latency. Handles 80% of all routine interactions without network dependency. Offline capability
      target Core functionality designed to operate for 72 hours without cloud connectivity. Student progress
      synchronises automatically when connectivity restores. Designed for rural deployments and network
      outage resilience. Interaction loop target Student input → AMDC engagement detection → SEOM safety
      check (λ=4.0/5.0) → GRPO policy decision → response generation → display + projector + audio output.
      Target latency: <100 ms end-to-end.'
  - section_id: SENPAI-EXP-0154
    section_path: Hardware, AI stack, and architecture in full. > Edge · School · Cloud — designed for
      resilience . > Architecture > Tier 2 · Classroom / School Server - Local Gateway — Coordination,
      MIS Sync, Analytics
    claim_status: architecture_design_intent
    atomic_unit_type: architecture_tier
    source_fragment: css:.arch-tier:2
    source_record_index: 154
    curation_method: structured_paraphrase_from_official_dom_unit
    content: 'The planned Senpai architecture defines Tier 2 · Classroom / School Server - Local Gateway
      — Coordination, MIS Sync, Analytics as: Fleet coordination Intel NUC or equivalent school server.
      Coordinates 10–30 Senpai units via CRL-MRS. Manages MIS synchronisation with SIMS, Bromcom, Arbor.
      Caches curriculum content for offline operation. Network requirement 1 Gbps LAN (minimum). 100 Mbps
      WAN uplink. Each Senpai streams 3–5 Mbps projector output to local server for teacher monitoring.
      30-unit classroom: 90–150 Mbps aggregate. Wi-Fi 6 (802.11ax, MU-MIMO) or wired Ethernet required.
      Teacher dashboard Handles all teacher dashboard requests locally — live class engagement, STUM flags,
      safeguarding alerts (SEOM E12). Low-latency dashboard updates via WebSocket. MIS export queued for
      cloud sync.'
  - section_id: SENPAI-EXP-0155
    section_path: Hardware, AI stack, and architecture in full. > Edge · School · Cloud — designed for
