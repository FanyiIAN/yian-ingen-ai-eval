    text: 'The Senpai engineering plan defines Phase 5, ''Subsystem Qualification'', as: Hardware: IP54
      + battery + drop test. Firmware: edge AI latency (<15 ms GRPO, <5 ms SEOM). AI: GRPO convergence
      + SEOM 12-rule SiL validation. Backend: 100-unit load test. Planned output or timing: Output: Subsystem
      test reports · Weeks 20–26.'
  - fact_id: SENPAI-XF0106
    section_id: SENPAI-EXP-0106
    text: 'The Senpai engineering plan defines Phase 6, ''Integration & Verification'', as: Integration
