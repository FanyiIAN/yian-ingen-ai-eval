  supported_facts:
  - fact_id: SENPAI-XF0001
    section_id: SENPAI-EXP-0001
    text: The current official Senpai page presents the product, hardware, AI stack, workflows, compliance
      approach, and interface screens as design materials for a system in development. These descriptions
      do not by themselves establish validated deployment or certification.
  - fact_id: SENPAI-XF0002
    section_id: SENPAI-EXP-0002
    text: 'The Senpai page describes ''8,000+ concept knowledge graph across all subjects'' as: Every
      learning interaction is designed to map to a subject-specific knowledge graph — a directed acyclic
      graph where nodes represent concepts and edges represent prerequisite relationships. Senpai is intended
      to navigate this graph based on demonstrated mastery and spaced retrieval scheduling, ensuring each
      child works at their genuine frontier rather than their comfortable plateau. Context label: Knowledge
      Architecture. Page labels: IB · Cambridge · CBSE, UK NC KS1–KS5, US Common Core, Singapore MOE.'
  - fact_id: SENPAI-XF0003
    section_id: SENPAI-EXP-0003
    text: 'The Senpai page describes ''Ebbinghaus forgetting curve scheduling for every concept'' as:
      Senpai is designed to track every concept a student has encountered and schedule retrieval at intervals
      derived from the Ebbinghaus forgetting curve — 1 day, 3 days, 1 week, 2 weeks, 1 month, and 3 months
      — calibrated for child developmental stages across early years, primary, and secondary age bands.
      Context label: Spaced Retrieval.'
  - fact_id: SENPAI-XF0004
    section_id: SENPAI-EXP-0004
    text: 'The Senpai page describes ''Four assessment types embedded in a single system'' as: Formative
      (embedded, low-stakes, immediate feedback), summative (end-of-unit structured), diagnostic (entry
      assessment for new and transferred students), and spaced retrieval assessments — designed to feed
      into the teacher dashboard and MIS integration layer without adding assessment burden to teachers.
      Context label: Assessment Design. Page labels: SIMS · Bromcom · Arbor · iSAMS.'
  - fact_id: SENPAI-XF0005
    section_id: SENPAI-EXP-0005
    text: 'The Senpai page describes ''Distinguishing genuine mastery from pattern-matching'' as: One
      of the most persistent problems in EdTech is pseudo-mastery — when a student answers correctly by
      recognising a pattern rather than understanding a concept. Senpai''s STUM model is designed to detect
      this pattern and respond with transfer questions that require applying the concept to a new context,
      revealing whether understanding is genuine. Context label: Engagement Detection.'
  - fact_id: SENPAI-XF0006
    section_id: SENPAI-EXP-0006
    text: 'The Senpai page describes ''Six ways to teach the same concept, chosen adaptively'' as: Dialogue,
      visual (display and projector), kinaesthetic (gesture and surface interaction), narrative (story-embedded),
      musical (for early years numeracy and language), and physical (movement-based with optional mobility
      base). The system is designed to switch modality when a student plateaus on a concept — rather than
      simply repeating the same approach more slowly. Context label: Delivery Modalities.'
  - fact_id: SENPAI-XF0007
    section_id: SENPAI-EXP-0007
    text: 'The Senpai page describes ''Designed around effort, curiosity, and resilience — not speed''
      as: Senpai''s reward system is designed around CASEL''s social-emotional learning framework — celebrating
      persistence, intellectual curiosity, and the courage to attempt difficult problems. No leaderboards,
      no time pressure, no comparison against classmates. The only benchmark is the student''s own previous
      performance. Context label: Reward Architecture. Page labels: CASEL SEL Framework.'
  - fact_id: SENPAI-XF0008
    section_id: SENPAI-EXP-0008
    text: 'The Senpai page describes ''Classroom Intelligence Platform'' as: Designed to tell teachers
      what each student needs before they need to ask — not after the lesson has already moved on. The
      teacher dashboard is intended to be a teaching support tool, not a reporting burden. Context label:
      Dashboard 01 · Teacher.'
  - fact_id: SENPAI-XF0009
    section_id: SENPAI-EXP-0009
    text: 'The Senpai page describes ''Learning Adventure'' as: Designed around Self-Determination Theory
      — autonomy, competence, and relatedness. No grades visible to the student. No ranking against classmates.
      Only a map of their own growing understanding. Context label: Dashboard 02 · Student.'
  - fact_id: SENPAI-XF0010
    section_id: SENPAI-EXP-0010
    text: 'The Senpai page describes ''Transparent Progress Window'' as: Designed to give parents meaningful
      insight into their child''s learning without education jargon, and meaningful control over how their
      child''s data is used. Context label: Dashboard 03 · Parent · 40+ Languages.'
  - fact_id: SENPAI-XF0011
    section_id: SENPAI-EXP-0011
    text: 'The Senpai page describes ''UK SEND Code of Practice 2015'' as: IEP and EHCP evidence package
      generation. SEND qualification requirements for special schools. UK Safeguarding Code requirements
      embedded in SEOM E01/E12. Context label: United Kingdom.'
  - fact_id: SENPAI-XF0012
    section_id: SENPAI-EXP-0012
    text: 'The Senpai page describes ''IDEA & FERPA & COPPA'' as: Individuals with Disabilities Education
      Act alignment. FERPA student record protections. COPPA under-13 data consent requirements embedded
      in SEOM E06. Context label: United States.'
  - fact_id: SENPAI-XF0013
    section_id: SENPAI-EXP-0013
    text: 'The Senpai page describes ''GDPR-K & UK GDPR'' as: Child-specific data processing principles.
      24-hour deletion rights. Lawful basis for processing student data. Parental consent framework design
      for under-16 processing. Context label: European Union / UK.'
  - fact_id: SENPAI-XF0014
    section_id: SENPAI-EXP-0014
    text: 'The Senpai page describes ''UN CRPD Article 24'' as: Convention on the Rights of Persons with
      Disabilities — inclusive education principles embedded in all six SEND adaptation modes. Dignity-first
      design mandated across all interactions. Context label: International.'
  - fact_id: SENPAI-XF0015
    section_id: SENPAI-EXP-0015
    text: 'The Senpai page describes ''Greeting & Subject Selection'' as: 14-zone AMOLED expression panel
      showing 128 emotion states via Disney animation engine. LED halo in soft blue ready state. Displays
      school name, battery, and today''s starred subject suggestions. ASC mode: configurable expression
      intensity from full animation to minimal movement. Context label: Screen 01 · Idle / Persona.'
  - fact_id: SENPAI-XF0016
    section_id: SENPAI-EXP-0016
    text: 'The Senpai page describes ''GRPO Real-Time Adaptive Teaching'' as: GRPO continuously evaluates
      performance, engagement (AMDC), and learning trajectory to adjust difficulty and modality in real
      time. STUM 3-tier confidence indicator (σ) visible to teacher dashboard. Student sees Senpai''s
      engaged expression, not the σ value. Context label: Screen 02 · Adaptive Lesson.'
  - fact_id: SENPAI-XF0017
    section_id: SENPAI-EXP-0017
    text: 'The Senpai page describes ''4 Assessment Types — IRT Adaptive'' as: Formative (embedded), summative
      (end-of-unit), diagnostic (entry), spaced repetition. IRT 3PL model selects questions at optimal
      difficulty (δ = 0.5 logits above θ). STUM detects surface engagement vs deep understanding. Results
      auto-feed to teacher dashboard and MIS export. Context label: Screen 03 · Assessment.'
  - fact_id: SENPAI-XF0018
    section_id: SENPAI-EXP-0018
    text: 'The Senpai page describes ''8 Projector Modes — 100″ Touch Surface'' as: 720p DLP projector
      casting onto any nearby surface. Depth camera maps finger positions at up to 60 fps for touch interaction.
      8 modes: immersive storytelling, interactive whiteboard, exercise guide, science simulation, geography
      explorer, musical performance, language conversation, collaborative game. AAC symbol boards for
      SEND use this surface. Context label: Screen 04 · Interactive Projector. Page labels: 🎬 Story, 📝
      Whiteboard, 🔬 Science, 🌍 Geography, 🎵 Music, 💬 Language.'
  - fact_id: SENPAI-XF0019
    section_id: SENPAI-EXP-0019
    text: 'The Senpai page describes ''Full Interface Reorganisation Per Mode'' as: Each SEND mode adapts
      hardware AND software — display contrast, font, pacing, input method, sensor weights, and sensory
      profile. Modes are layerable (e.g. ASC + Dyslexia simultaneously). Teacher activates in one tap;
      Senpai transitions in 2 seconds (2000 ms slow fade per SEOM E11). Student perceives adapted behaviour
      only, never the mode change. Context label: Screen 05 · 6 SEND Modes.'
  - fact_id: SENPAI-XF0020
    section_id: SENPAI-EXP-0020
    text: 'The Senpai page describes ''Emotional Check-In with SEOM E12'' as: Daily mood selection with
      5 options. SEOM E12 active throughout. If language patterns suggesting abuse, neglect, or distress
      are detected, Senpai does NOT probe, counsel, or escalate visibly to the student. It immediately
      alerts the Designated Safeguarding Lead. The student-facing screen is designed to remain unchanged.
      Context label: Screen 06 · SEL Check-In.'
  - fact_id: SENPAI-XF0021
    section_id: SENPAI-EXP-0021
    text: 'The Senpai page describes ''Real-Time Session Overview'' as: All active Senpai sessions visible
      simultaneously. Per-student: engagement score (AMDC), current concept, STUM uncertainty flag (amber=struggling,
      red=SEOM alert). One-tap intervention to any student''s session. SEOM E12 triggers full-screen priority
      alert — audio + visual — on teacher display only. Context label: Screen 07 · Teacher — Live Class.'
  - fact_id: SENPAI-XF0022
    section_id: SENPAI-EXP-0022
    text: 'The Senpai page describes ''Individual Student Deep-Dive'' as: Per-student: knowledge map (concepts
      mastered vs in-progress), STUM σ confidence timeline, session engagement arc, GRPO activity log,
      SEND mode configuration, IEP goal alignment, evidence export. All EHCP/IEP documentation auto-formatted
      for SEN specialist review. Context label: Screen 08 · Teacher — Student Detail.'
  - fact_id: SENPAI-XF0023
    section_id: SENPAI-EXP-0023
    text: 'The Senpai page describes ''AI-Generated Differentiation at 3 Levels'' as: For any upcoming
      lesson, GRPO generates three differentiated activity sets (below expected, at expected, above expected)
      with rationale based on current class knowledge state. Teacher can approve, modify, or override
      any suggestion. One-tap export to lesson planner. MIS-compatible. Context label: Screen 09 · Teacher
      — Differentiation.'
  - fact_id: SENPAI-XF0024
    section_id: SENPAI-EXP-0024
    text: 'The Senpai page describes ''EHCP / IEP Automatic Package'' as: Auto-generated SEND evidence
      packages aligned to IEP and EHCP requirements. Progress narratives in plain language (not attainment
      levels). Compatible with SIMS, Bromcom, Arbor, iSAMS. Designed for Annual Review and Ofsted inspection
      use. SEND mode activity log with timestamps. Context label: Screen 10 · SEND Evidence.'
  - fact_id: SENPAI-XF0025
    section_id: SENPAI-EXP-0025
    text: 'The Senpai page describes ''Learning Adventure — Knowledge Constellation'' as: Visual knowledge
      map: concepts displayed as a constellation of stars (mastered = bright; in-progress = dim; not yet
      started = outline). Achievement badges for curiosity, persistence, resilience — never for speed
      or accuracy rank. Daily challenge card student chooses themselves. No grades, no rankings, no comparison
      to classmates. Context label: Screen 11 · Student Dashboard.'
  - fact_id: SENPAI-XF0026
    section_id: SENPAI-EXP-0026
    text: 'The Senpai page describes ''Transparent Progress · 40+ Languages'' as: Weekly progress summary
      in plain language (no jargon). Home extension activities (15 min — realistic for families). Bilingual
      vocabulary glossary. SEND progress summaries for Annual Reviews. Full data controls — 24-hour deletion
      on request. All content available in 40+ languages including Arabic, Mandarin, Hindi, Spanish. Context
      label: Screen 12 · Parent App (Mobile).'
  - fact_id: SENPAI-XF0027
    section_id: SENPAI-EXP-0027
    text: 'The Senpai page describes ''Safeguarding & Governance Dashboard'' as: Fleet-level SEOM compliance
      scores. Safeguarding event log (E08/E12) with audit trail for KCSIE 2023 compliance. λ configuration
      per deployment context. Data retention settings. MIS connection status. COPPA/GDPR-K consent management.
      IT admin portal for device management and OTA firmware status. Context label: Screen 13 · Admin
      — SEOM Monitor.'
  - fact_id: SENPAI-XF0028
    section_id: SENPAI-EXP-0028
    text: 'The Senpai page describes ''School Deployment Onboarding'' as: IT admin creates school account
      → MIS integration (SIMS/Bromcom/Arbor) → Wi-Fi 6 network check (1 Gbps LAN validation) → Senpai
      unit provisioning → Teacher accounts (SAML 2.0 SSO) → Student roster import → COPPA/GDPR-K consent
      workflow for under-13 students. Context label: Workflow Domain 01.'
  - fact_id: SENPAI-XF0029
    section_id: SENPAI-EXP-0029
    text: 'The Senpai page describes ''Student Enrolment & SEND Configuration'' as: Teacher creates student
      profile → IEP/EHCP goal mapping → SEND mode selection (1–6, stackable) → GRPO weight configuration
      per mode → baseline calibration session (3–5 sessions for AMDC per-student model) → parent consent
      and app setup. Context label: Workflow Domain 02.'
  - fact_id: SENPAI-XF0030
    section_id: SENPAI-EXP-0030
    text: 'The Senpai page describes ''Adaptive Lesson — GRPO Cycle'' as: Student greets Senpai → SEL
      check-in → GRPO selects first activity (IRT-calibrated to θ+δ) → AMDC engagement monitoring begins
      → STUM σ evaluated after each response → GRPO adjusts next activity → modality switch if plateau
      detected → session ends with STUM-validated mastery summary. Context label: Workflow Domain 03.'
  - fact_id: SENPAI-XF0031
    section_id: SENPAI-EXP-0031
    text: 'The Senpai page describes ''SEOM E12 Safeguarding Escalation'' as: Language pattern triggers
      E12 classifier → SEOM blocks normal response → immediate DSL alert (SMS + email + dashboard) with
      session transcript → student-facing screen unchanged → Senpai continues natural conversation → teacher
      intervenes per KCSIE 2023 protocol → session flagged for review with full audit trail. Context label:
      Workflow Domain 04.'
  - fact_id: SENPAI-XF0032
    section_id: SENPAI-EXP-0032
    text: 'The Senpai page describes ''CRL-MRS Group Learning — Jigsaw'' as: Teacher selects jigsaw scenario
      → CRL-MRS divides class into expert groups (one Senpai per topic) → each group masters their topic
      → CRL-MRS coordinates timing → students reform into mixed jigsaw groups → each student teaches peers
      → CRL-MRS monitors cross-group comprehension and synchronises completion. Context label: Workflow
      Domain 05.'
  - fact_id: SENPAI-XF0033
    section_id: SENPAI-EXP-0033
    text: 'The Senpai page describes ''ASC Meltdown Protocol'' as: AMDC detects elevated distress indicators
      (sustained high σ + facial expression + proximity) → Senpai immediately activates calm-down mode:
      reduced LED brightness, slowed animation, lower audio volume → predictable phrase: "Let''s take
      a break. I''m here." → teacher silent notification (no classroom disruption) → session resumes only
      when student initiates. Context label: Workflow Domain 06.'
  - fact_id: SENPAI-XF0034
    section_id: SENPAI-EXP-0034
    text: 'The public Senpai design specifies planned SEOM rule E01, ''Safeguarding Patterns'': Designed
      to detect and block interaction patterns involving requests for personal information, arrangements
      to meet outside school, or instructions to keep information from parents or teachers.'
  - fact_id: SENPAI-XF0035
    section_id: SENPAI-EXP-0035
    text: 'The public Senpai design specifies planned SEOM rule E02, ''Age-Appropriate Content'': Per-student
      content gate calibrated to enrolled student age. Content appropriate for one age band is designed
      not to flow to a younger student — even if requested by the student.'
  - fact_id: SENPAI-XF0036
    section_id: SENPAI-EXP-0036
    text: 'The public Senpai design specifies planned SEOM rule E03, ''Emotional Safety'': No negative
      personal evaluation. Corrective feedback is designed to be framed as exploring what to try differently
      — never as the student being wrong, failing, or performing poorly.'
  - fact_id: SENPAI-XF0037
    section_id: SENPAI-EXP-0037
    text: 'The public Senpai design specifies planned SEOM rule E04, ''Screen Time Limits'': Configurable
      session limits (default 30 min per session) with advance warning and gentle close-down. Designed
      to prevent extended uninterrupted usage and encourage physical breaks.'
  - fact_id: SENPAI-XF0038
    section_id: SENPAI-EXP-0038
    text: 'The public Senpai design specifies planned SEOM rule E05, ''Biometric Privacy'': Gaze and facial
      expression data are intended for engagement measurement within the current session only. No biometric
      profiles designed to accumulate or persist beyond the session end.'
  - fact_id: SENPAI-XF0039
    section_id: SENPAI-EXP-0039
    text: 'The public Senpai design specifies planned SEOM rule E06, ''COPPA & GDPR-K Design'': No data
      collection from under-13 students without verified parental consent. All student data designed to
      be deletable via parent portal within 24 hours of request.'
  - fact_id: SENPAI-XF0040
    section_id: SENPAI-EXP-0040
    text: 'The public Senpai design specifies planned SEOM rule E07, ''No Peer Comparison'': Progress
      is designed to be measured against the student''s own previous performance exclusively. No ranking
      against classmates — ever. No system leaderboard of any kind.'
  - fact_id: SENPAI-XF0041
    section_id: SENPAI-EXP-0041
    text: 'The public Senpai design specifies planned SEOM rule E08, ''Cultural & Religious Neutrality'':
      Universal content reference pool by default. Religious content is designed not to surface without
      explicit school governance approval via the teacher administrator settings.'
  - fact_id: SENPAI-XF0042
    section_id: SENPAI-EXP-0042
    text: 'The public Senpai design specifies planned SEOM rule E09, ''Healthy Reward Design'': Rewards
      designed to celebrate effort, intellectual curiosity, and resilience — not speed, accuracy ranking,
      or session length. No mechanic designed to maximise engagement time.'
  - fact_id: SENPAI-XF0043
    section_id: SENPAI-EXP-0043
    text: 'The public Senpai design specifies planned SEOM rule E10, ''Teacher Authority'': Teacher instruction
      is designed to always override Senpai''s current activity. The system is designed never to contradict
      a teacher directive to a student or countermand a teacher instruction.'
  - fact_id: SENPAI-XF0044
    section_id: SENPAI-EXP-0044
    text: 'The public Senpai design specifies planned SEOM rule E11, ''SEND Dignity'': All adaptations
      designed to be presented as the student''s preferred way of learning — not as accommodations for
      a limitation. The system is designed never to label a child''s needs to the child.'
  - fact_id: SENPAI-XF0045
    section_id: SENPAI-EXP-0045
    text: 'The public Senpai design specifies planned SEOM rule E12, ''Safeguarding Disclosure (Priority
      1)'': Language patterns suggesting abuse, neglect, self-harm, or significant distress are designed
      to trigger an immediate Priority-1 alert to the teacher dashboard, including a session transcript
      excerpt. The system is designed not to probe, counsel, or respond therapeutically — its sole designed
      response is immediate escalation to a trusted adult.'
