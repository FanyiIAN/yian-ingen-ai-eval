  supported_facts:
  - fact_id: FARI-XF0001
    section_id: FARI-EXP-0001
    text: The current official Fari page says that Fari is in active development and is not yet commercially
      available. Features, specifications, performance figures, interface screens, and engineering milestones
      on the page are design targets that may change.
  - fact_id: FARI-XF0002
    section_id: FARI-EXP-0002
    text: 'Planned capability: Medication Management. Designed to deliver personalised medication reminders
      with visual and audio cues, confirm intake via computer vision, and alert caregivers to missed doses.
      SEOM Rule F02 governs all medication interactions. Category: Health.'
  - fact_id: FARI-XF0003
    section_id: FARI-EXP-0003
    text: 'Planned capability: Companion Conversations. Natural language interaction designed to reduce
      loneliness. Fari''s Socially-aware Trajectory Understanding Model (STUM) is designed to calibrate
      conversation style based on resident preferences and emotional state. Category: Emotional AI.'
  - fact_id: FARI-XF0004
    section_id: FARI-EXP-0004
    text: 'Planned capability: Fall Detection & Prevention. Using mmWave radar and depth cameras, Fari
      is designed to monitor gait patterns and predict fall risk. The HTD-IRL model uses inverse reinforcement
      learning to identify pre-fall biomechanical signatures. Category: Safety.'
  - fact_id: FARI-XF0005
    section_id: FARI-EXP-0005
    text: 'Planned capability: Autonomous Navigation. WBT1 mobility platform designed for smooth, safe
      navigation in care environments. Multi-sensor SLAM with LiDAR, depth cameras, and ultrasonic arrays
      enables obstacle avoidance and room-to-room autonomy. Category: Mobility.'
  - fact_id: FARI-XF0006
    section_id: FARI-EXP-0006
    text: 'Planned capability: Continuous Vital Signs. Designed to monitor heart rate, SpO₂, respiratory
      rate, skin temperature, and blood pressure estimation continuously via non-invasive sensors. Category:
      Health. Page labels: SEOM F01, 14-Sensor Suite.'
  - fact_id: FARI-XF0007
    section_id: FARI-EXP-0007
    text: 'Planned capability: Sleep Quality Analysis. Non-contact sleep monitoring designed to track
      sleep stages, breathing patterns, and nocturnal movement using mmWave radar and ambient sensors.
      Category: Health. Page labels: mmWave Radar, Non-Contact.'
  - fact_id: FARI-XF0008
    section_id: FARI-EXP-0008
    text: 'Planned capability: Health Trend Baselines. AI designed to establish individual baseline health
      profiles during a 14-day onboarding period, enabling detection of subtle deviations from personal
      norms. Category: Health. Page labels: GRPO Model, Personalised.'
  - fact_id: FARI-XF0009
    section_id: FARI-EXP-0009
    text: 'Planned capability: Environmental Monitoring. Designed to track room temperature, humidity,
      air quality, and light levels to identify environmental factors affecting resident health and comfort.
      Category: Health. Page labels: BME680, Ambient.'
  - fact_id: FARI-XF0010
    section_id: FARI-EXP-0010
    text: 'Planned capability: EHR Integration. Designed to synchronise observations with Electronic Health
      Records via HL7 FHIR R4 APIs, enabling seamless clinical data flow with target sync latency under
      5 minutes. Category: Health. Page labels: FHIR R4, HL7.'
  - fact_id: FARI-XF0011
    section_id: FARI-EXP-0011
    text: 'Planned capability: Medication Reminders. Personalised audio and visual medication reminders
      designed with escalation protocols — gentle prompt → detailed instructions → caregiver alert. Governed
      by SEOM Rule F02. Category: Medication. Page labels: SEOM F02, 3-Tier Escalation.'
  - fact_id: FARI-XF0012
    section_id: FARI-EXP-0012
    text: 'Planned capability: Intake Confirmation. Computer vision designed to visually confirm medication
      intake and detect potential missed doses, logging all events for clinical review. Category: Medication.
      Page labels: Computer Vision, SEOM F02.'
  - fact_id: FARI-XF0013
    section_id: FARI-EXP-0013
    text: 'Planned capability: Emotion Recognition. AMDC model designed to analyse facial micro-expressions,
      vocal prosody, and behavioural patterns to assess emotional state with target accuracy of 87.4%.
      Category: Emotional AI. Page labels: AMDC, Multi-modal.'
  - fact_id: FARI-XF0014
    section_id: FARI-EXP-0014
    text: 'Planned capability: Companion Conversations. Natural language interaction designed to reduce
      feelings of loneliness. STUM model calibrates conversation style, topic selection, and emotional
      tone to each resident. Category: Emotional AI. Page labels: STUM, NLP.'
  - fact_id: FARI-XF0015
    section_id: FARI-EXP-0015
    text: 'Planned capability: Activity Engagement. Designed to suggest and facilitate cognitive exercises,
      music therapy, reminiscence activities, and gentle physical exercises tailored to individual capability
      and preference. Category: Emotional AI. Page labels: Personalised, Adaptive.'
  - fact_id: FARI-XF0016
    section_id: FARI-EXP-0016
    text: 'Planned capability: Family Connection. Video calling with auto-framing (target 1080p), wellbeing
      digest sharing, and activity photo sharing — all governed by SEOM F08 and F10 consent rules. Category:
      Emotional AI. Page labels: SEOM F08, SEOM F10.'
  - fact_id: FARI-XF0017
    section_id: FARI-EXP-0017
    text: 'Planned capability: Fall Detection. Multi-sensor fall detection designed with target response
      time of under 3.2 seconds from detection to caregiver notification. Uses depth cameras and mmWave
      radar. Category: Safety. Page labels: SEOM F03, HTD-IRL.'
  - fact_id: FARI-XF0018
    section_id: FARI-EXP-0018
    text: 'Planned capability: Fall Prevention. HTD-IRL model designed to analyse gait patterns using
      inverse reinforcement learning to identify pre-fall biomechanical signatures and alert staff proactively.
      Category: Safety. Page labels: Gait Analysis, Predictive.'
  - fact_id: FARI-XF0019
    section_id: FARI-EXP-0019
    text: 'Planned capability: Emergency Protocols. SEOM Rule F03 mandates that emergency detection always
      takes priority over all other operations. Designed with multi-channel alerting: on-device, dashboard,
      mobile push, and SMS. Category: Safety. Page labels: SEOM F03, Priority Override.'
  - fact_id: FARI-XF0020
    section_id: FARI-EXP-0020
    text: 'Planned capability: Wandering Detection. Designed for residents with cognitive impairment —
      monitors movement patterns and triggers alerts when unusual wandering behaviour is detected, especially
      during night hours. Category: Safety. Page labels: Memory Care, Geofencing.'
  - fact_id: FARI-XF0021
    section_id: FARI-EXP-0021
    text: 'Planned capability: Autonomous Navigation. WBT1 mobility platform with multi-sensor SLAM using
      LiDAR, depth cameras, and ultrasonic arrays. Designed for smooth, safe movement through complex
      care environments. Category: Mobility. Page labels: WBT1, SLAM.'
  - fact_id: FARI-XF0022
    section_id: FARI-EXP-0022
    text: 'Planned capability: Room-to-Room Patrol. Designed for scheduled and on-demand room visits,
      enabling Fari to check on residents, deliver medication reminders, and provide companionship across
      an entire care facility. Category: Mobility. Page labels: Scheduling, Multi-Room.'
  - fact_id: FARI-XF0023
    section_id: FARI-EXP-0023
    text: 'Planned capability: Obstacle Avoidance. Real-time obstacle detection and path planning designed
      with safety-first principles — Fari is designed to always yield to humans and stop immediately on
      contact detection. Category: Mobility. Page labels: Safety-First, Real-Time.'
  - fact_id: FARI-XF0024
    section_id: FARI-EXP-0024
    text: 'The Fari hardware design lists Target Height under Physical Platform with the target value
      or configuration: ~120 cm.'
  - fact_id: FARI-XF0025
    section_id: FARI-EXP-0025
