    content: 'The Fari interface design lists these Motor Control accessibility provisions: Large touch
      targets with generous spacing. Voice control for all primary functions. Reduced motion mode available.
      No time-limited interactions. Single-tap actions — no gestures required for core functions.'
  - section_id: FARI-EXP-0158
    section_path: Design for people who need it most. > Designed for every ability. > Accessibility >
