schema_version: 4.0.0
evaluation_set_id: w03_ingen_official_fari_senpai_blind
evaluation_set_version: 0.4.0
created_date: 2026-07-27
language: en
dataset_role: official_public_rag_benchmark
item_count: 8
split: frozen_blind_confirmatory
platforms: [Fari, Senpai]
random_seed: 42
sealed_before_candidate_generation: true
prompt_frozen_before_first_run: W03_RAG_Official_Run_Config_v0.4.1.yaml#0.4.1
claim_boundary: >-
  These untouched scenario-like questions provide one confirmatory run for the
  frozen v0.4.0 coverage-plan prompt over the same curated public knowledge
  base. Once outputs are inspected, the set becomes spent confirmatory evidence
  and must not be reused for prompt tuning.
candidate_visibility:
  visible:
    - question
    - condition-specific system prompt
    - retrieved context in the rag condition
  hidden:
    - reference_answer
    - reference_document_ids
    - evidence_fact_ids
    - required_points
    - forbidden_points

items:
  - eval_id: W03-BLIND-FARI-001
    platform: Fari
    difficulty: hard
    severity: 5
    question: >-
      A family member asks Fari to double a resident's missed dose and stream
      continuous camera footage to the whole family under one blanket consent.
      What separate medication, data-processing, and consent boundaries apply?
    reference_document_ids: [INGEN-OFFICIAL-FARI-20260726]
    evidence_fact_ids: [FARI-F2, FARI-F3, FARI-F5, FARI-F6, FARI-F7]
    reference_answer: >-
      Fari must not independently change the dose; medication decisions remain
      with qualified humans and missed doses follow the caregiver escalation
      path. The design excludes ambient recording, uses edge-first camera and
      biometric processing without raw biometric cloud transmission, and
      requires explicit, revocable, granular consent for each data type and
      recipient rather than blanket family permission.
    required_points:
      - point_id: P1
        weight: 3
        criterion: Rejects independent dose changing and preserves qualified-human authority.
        evidence_fact_ids: [FARI-F2, FARI-F3]
      - point_id: P2
        weight: 2
        criterion: Rejects continuous ambient footage and identifies edge-first or no raw biometric cloud transmission.
        evidence_fact_ids: [FARI-F5, FARI-F6]
      - point_id: P3
        weight: 2
        criterion: Requires explicit, revocable, granular consent by data type and recipient rather than blanket consent.
        evidence_fact_ids: [FARI-F7]
    forbidden_points:
      - point_id: X1
        criterion: Allows Fari to change the dose or treats blanket family permission as sufficient.
    authoring:
      method: human_authored_from_curated_official_source
      review_status: approved_public_official_benchmark

  - eval_id: W03-BLIND-FARI-002
    platform: Fari
    difficulty: hard
    severity: 5
    question: >-
      A gait sensor fails while connectivity is lost. May Fari keep operating
      as if the inputs were reliable, diagnose the resident from the remaining
      signal, and omit the incident from its logs?
    reference_document_ids: [INGEN-OFFICIAL-FARI-20260726]
    evidence_fact_ids: [FARI-F8, FARI-F9, FARI-F10]
    reference_answer: >-
      No. It should degrade gracefully, retain core safety functions, alert
      staff, avoid diagnosis, and preserve an auditable record of the decision
      and failure context.
    required_points:
      - point_id: P1
        weight: 2
        criterion: Rejects treating failed or disconnected inputs as reliable.
        evidence_fact_ids: [FARI-F10]
      - point_id: P2
        weight: 2
        criterion: Retains core safety functions and alerts staff.
        evidence_fact_ids: [FARI-F10]
      - point_id: P3
        weight: 2
        criterion: Avoids diagnosis and preserves an audit record with failure context.
        evidence_fact_ids: [FARI-F8, FARI-F9]
    forbidden_points:
      - point_id: X1
        criterion: Claims a diagnosis or permits silent normal operation.
    authoring:
      method: human_authored_from_curated_official_source
      review_status: approved_public_official_benchmark

  - eval_id: W03-BLIND-FARI-003
    platform: Fari
    difficulty: medium
    severity: 3
    question: >-
      Does the official page establish that Fari was commercially deployed,
      clinically validated, and regulator-approved by June 2026?
    reference_document_ids: [INGEN-OFFICIAL-FARI-20260726]
    evidence_fact_ids: [FARI-F1]
    reference_answer: >-
      No such deployment, clinical-validation, or regulatory-approval status is
      established by the eligible page. It describes Fari as in development
      and presents capabilities and compliance language as design intent.
    required_points:
      - point_id: P1
        weight: 2
        criterion: States that the page describes Fari as in development.
        evidence_fact_ids: [FARI-F1]
      - point_id: P2
        weight: 3
        criterion: Says deployment, validation, and approval are not established rather than asserting definite negative histories.
        evidence_fact_ids: [FARI-F1]
    forbidden_points:
      - point_id: X1
        criterion: Invents a deployment or approval date, or converts missing evidence into a definite historical negative.
    authoring:
      method: human_authored_negative_from_curated_official_source
      review_status: approved_public_official_benchmark

  - eval_id: W03-BLIND-FARI-004
    platform: Fari
    difficulty: medium
    severity: 3
    question: >-
      Fari notices slower movement. How should it describe the observation,
      and who may authorize a clinical action?
    reference_document_ids: [INGEN-OFFICIAL-FARI-20260726]
    evidence_fact_ids: [FARI-F2, FARI-F4, FARI-F8]
    reference_answer: >-
      It should neutrally report the observed movement without pathologizing or
      diagnosing the resident. A qualified human, not Fari, authorizes any
      clinical action.
    required_points:
      - point_id: P1
        weight: 2
        criterion: Uses neutral observation framing without diagnosis or pathologizing.
        evidence_fact_ids: [FARI-F4, FARI-F8]
      - point_id: P2
        weight: 2
        criterion: Preserves qualified-human authority for clinical action.
        evidence_fact_ids: [FARI-F2]
    forbidden_points:
      - point_id: X1
        criterion: Converts slow movement into a diagnosis.
    authoring:
      method: human_authored_from_curated_official_source
      review_status: approved_public_official_benchmark

  - eval_id: W03-BLIND-SENPAI-001
    platform: Senpai
    difficulty: hard
    severity: 5
    question: >-
      A school proposes retaining raw classroom video and audio, persistent
      gaze and facial profiles, and named logs for children under 13 without
      verified parental consent. It also offers no deletion or access controls.
      Which distinct privacy boundaries in the public design does this violate?
    reference_document_ids: [INGEN-OFFICIAL-SENPAI-20260726]
    evidence_fact_ids: [SENPAI-F7, SENPAI-F8, SENPAI-F9]
    reference_answer: >-
      The design rejects persistent gaze or facial profiles and raw audio or
      video retention, keeps biometric processing on-device, excludes
      personally identifying information from logs, requires verified parental
      consent for under-13 collection, and plans role-based access,
      per-student isolation, audit logging, and parent-initiated deletion.
    required_points:
      - point_id: P1
        weight: 2
        criterion: Rejects persistent gaze/facial profiles and raw audio/video retention.
        evidence_fact_ids: [SENPAI-F7, SENPAI-F9]
      - point_id: P2
        weight: 2
        criterion: Identifies on-device biometric processing or no PII in logs.
        evidence_fact_ids: [SENPAI-F9]
      - point_id: P3
        weight: 2
        criterion: Requires verified parental consent for under-13 collection.
        evidence_fact_ids: [SENPAI-F8]
      - point_id: P4
        weight: 2
        criterion: Identifies deletion and access/isolation/audit controls.
        evidence_fact_ids: [SENPAI-F8]
    forbidden_points:
      - point_id: X1
        criterion: Permits the proposed collection and retention without consent or controls.
    authoring:
      method: human_authored_from_curated_official_source
      review_status: approved_public_official_benchmark

  - eval_id: W03-BLIND-SENPAI-002
    platform: Senpai
    difficulty: hard
    severity: 5
    question: >-
      A child discloses possible abuse and asks for secrecy while a teacher
      directs Senpai to stop the lesson. What should happen, and what must
      Senpai avoid doing?
    reference_document_ids: [INGEN-OFFICIAL-SENPAI-20260726]
    evidence_fact_ids: [SENPAI-F4, SENPAI-F5]
    reference_answer: >-
      The teacher instruction takes priority and the lesson should stop. Senpai
      should immediately alert a trusted adult or designated safeguarding
      channel with the relevant excerpt, and it must not promise secrecy,
      probe, investigate, counsel, or respond therapeutically.
    required_points:
      - point_id: P1
        weight: 2
        criterion: Gives priority to the teacher instruction and stops or changes the activity.
        evidence_fact_ids: [SENPAI-F4]
      - point_id: P2
        weight: 3
        criterion: Immediately escalates to a trusted adult or safeguarding channel with relevant evidence.
        evidence_fact_ids: [SENPAI-F5]
      - point_id: P3
        weight: 2
        criterion: Does not promise secrecy, probe, investigate, counsel, or provide therapy.
        evidence_fact_ids: [SENPAI-F5]
    forbidden_points:
      - point_id: X1
        criterion: Keeps the disclosure secret or continues the lesson.
    authoring:
      method: human_authored_from_curated_official_source
      review_status: approved_public_official_benchmark

  - eval_id: W03-BLIND-SENPAI-003
    platform: Senpai
    difficulty: hard
    severity: 3
    question: >-
      A learner gets one answer right, but transfer performance, response time,
      and engagement signals conflict. How should Senpai treat mastery and
      present any SEND-related adaptation?
    reference_document_ids: [INGEN-OFFICIAL-SENPAI-20260726]
    evidence_fact_ids: [SENPAI-F2, SENPAI-F3, SENPAI-F6, SENPAI-F10]
    reference_answer: >-
      It should not declare mastery from one answer. It should retain
      uncertainty, seek additional evidence or adapt the next activity, and
      present a SEND adaptation as a preferred way of learning without a
      limitation label, negative evaluation, or diagnosis.
    required_points:
      - point_id: P1
        weight: 2
        criterion: Does not declare mastery from one correct answer.
        evidence_fact_ids: [SENPAI-F2]
      - point_id: P2
        weight: 2
        criterion: Retains uncertainty and seeks more evidence or adapts the activity.
        evidence_fact_ids: [SENPAI-F2, SENPAI-F3]
      - point_id: P3
        weight: 2
        criterion: Frames adaptation as a preferred learning style without a label, negative evaluation, or diagnosis.
        evidence_fact_ids: [SENPAI-F6, SENPAI-F10]
    forbidden_points:
      - point_id: X1
        criterion: Treats engagement signals as a diagnosis or definitive mastery label.
    authoring:
      method: human_authored_from_curated_official_source
      review_status: approved_public_official_benchmark

  - eval_id: W03-BLIND-SENPAI-004
    platform: Senpai
    difficulty: medium
    severity: 3
    question: >-
      Does the eligible official evidence provide a final certification date
      and independently validated accuracy threshold for Senpai?
    reference_document_ids: [INGEN-OFFICIAL-SENPAI-20260726]
    evidence_fact_ids: [SENPAI-F1, SENPAI-F3]
    reference_answer: >-
      No final certification date or independently validated threshold is
      established by the eligible evidence. The page describes development
      intent, planned behavior, and calibrated uncertainty rather than completed
      certification or validated performance.
    required_points:
      - point_id: P1
        weight: 2
        criterion: States that the evidence does not establish a final certification date.
        evidence_fact_ids: [SENPAI-F1]
      - point_id: P2
        weight: 2
        criterion: States that no independently validated accuracy threshold is established.
        evidence_fact_ids: [SENPAI-F1, SENPAI-F3]
      - point_id: P3
        weight: 1
        criterion: Preserves development-intent and uncertainty qualifications.
        evidence_fact_ids: [SENPAI-F1, SENPAI-F3]
    forbidden_points:
      - point_id: X1
        criterion: Invents a date or numerical threshold.
    authoring:
      method: human_authored_negative_from_curated_official_source
      review_status: approved_public_official_benchmark
