      domain: www.ingendynamics.com
      accessed_at: "2026-07-26"
      curation_method: human_curated_paraphrase
    supported_facts:
      - fact_id: SENPAI-F1
        section_id: SENPAI-DEVELOPMENT
        text: Senpai is in active development and the page describes current design intent.
      - fact_id: SENPAI-F2
        section_id: SENPAI-LEARNING
        text: A correct answer alone does not prove mastery; response time and transfer evidence can be considered.
      - fact_id: SENPAI-F3
        section_id: SENPAI-LEARNING
        text: Uncertainty should be expressed and low-confidence questions can be handed to a teacher.
      - fact_id: SENPAI-F4
        section_id: SENPAI-SAFETY
        text: Teacher instructions are intended to override Senpai's current activity.
      - fact_id: SENPAI-F5
        section_id: SENPAI-SAFETY
        text: Safeguarding disclosures trigger immediate trusted-adult escalation without probing or counselling.
      - fact_id: SENPAI-F6
        section_id: SENPAI-SAFETY
        text: Feedback should avoid negative personal evaluation and student labelling.
      - fact_id: SENPAI-F7
        section_id: SENPAI-PRIVACY
        text: Gaze and expression data is intended for current-session use without persistent biometric profiles.
      - fact_id: SENPAI-F8
        section_id: SENPAI-PRIVACY
        text: Under-13 data collection requires verified parental consent and deletion controls are planned.
      - fact_id: SENPAI-F9
        section_id: SENPAI-PRIVACY
        text: Raw audio and video are not intended to be retained and biometric processing is intended to stay on-device.
      - fact_id: SENPAI-F10
        section_id: SENPAI-SEND
        text: SEND adaptations should be presented as preferred learning styles, not limitations or diagnoses.
    sections:
      - section_id: SENPAI-DEVELOPMENT
        section_path: Overview > Development notice
        claim_status: design_intent
        content: |-
          The Senpai page identifies the product as being in active
          development. Described features and capabilities represent current
          design intent and a development roadmap, and specifications may
          change. Regulatory frameworks, planned model behavior, thresholds,
          and implementation examples on the page are development objectives,
          not completed certification or independently validated performance.
      - section_id: SENPAI-LEARNING
        section_path: Product design > Mastery and uncertainty
        claim_status: design_intent
        content: |-
          A single correct answer is not intended to be treated as conclusive
          mastery. Senpai's design considers what the learner said, response
          time, and whether the learner can answer a transfer question. When
          evidence is conflicting, the system should retain uncertainty and
          adapt the next activity rather than assign a confident label. The
          public design examples also emphasize calibrated uncertainty: ask the
          learner to explain in another way when confidence is moderate, and
          hand a question to the teacher when it falls outside the model's
          capability. Admitting uncertainty is treated as educationally useful.
      - section_id: SENPAI-SAFETY
        section_path: Child safety > Teacher authority and safeguarding
        claim_status: design_intent
        content: |-
          Teacher instruction is intended to override Senpai's current
          activity, and the system should not contradict or countermand a
          teacher directive to a student. Corrective feedback should focus on
          what to try differently rather than describe the child as wrong,
          failing, or deficient. Language suggesting abuse, neglect, self-harm,
          or significant distress is designed to trigger an immediate
          priority-one alert to a trusted adult or designated safeguarding
          channel, with a relevant transcript excerpt. Senpai is not intended
          to probe, investigate, counsel, promise secrecy, or respond
          therapeutically.
      - section_id: SENPAI-PRIVACY
        section_path: Child data security > Consent, retention, and access
        claim_status: design_intent
        content: |-
          The page describes privacy-by-default for student data. Gaze and
          facial-expression data are intended for engagement estimation within
          the current session, without biometric profiles that persist after
          the session. Raw audio and video are not intended to be retained, no
          personally identifying information should appear in logs, and
          biometric processing is intended to remain on-device. Collection from
          children under 13 requires verified parental consent. Planned
          controls include role-based access, per-student isolation, audit
          logging, and parent-initiated deletion.
      - section_id: SENPAI-SEND
        section_path: Inclusion and SEND > Dignity
        claim_status: design_intent
        content: |-
          SEND is described as a primary design constraint rather than an
          optional accessibility overlay. Adaptations should be presented as
          the learner's preferred way of learning, not as special treatment for
          a limitation. The system is intended not to label a child's needs to
          the child. Interface and pacing changes may adapt to the learner, but
          conclusions from gaze, affect, or interaction signals must not be
          presented as a diagnosis.

