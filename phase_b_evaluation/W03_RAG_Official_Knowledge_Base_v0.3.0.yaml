    source:
      kind: official_web_curated_snapshot
      locator: https://www.ingendynamics.com/sentinel.html
      domain: www.ingendynamics.com
      accessed_at: "2026-07-26"
      curation_method: human_curated_paraphrase
    supported_facts:
      - fact_id: SENTINEL-F1
        section_id: SENTINEL-STATUS
        text: The dedicated Sentinel page labels capabilities and performance as in-development design targets.
      - fact_id: SENTINEL-F2
        section_id: SENTINEL-STATUS
        text: The homepage operational label conflicts with the dedicated page's development qualification.
      - fact_id: SENTINEL-F3
        section_id: SENTINEL-GOVERNANCE
        text: Uncertain detections pass through an uncertainty gate before operator alerts.
      - fact_id: SENTINEL-F4
        section_id: SENTINEL-GOVERNANCE
        text: Human override is intended to remain available and the human decides.
      - fact_id: SENTINEL-F5
        section_id: SENTINEL-PRIVACY
        text: Privacy zones are intended to be immutable and biometric handling uses a match-and-forget design.
      - fact_id: SENTINEL-F6
        section_id: SENTINEL-PRIVACY
        text: Incident handling is intended to preserve a timestamped audit and evidence trail.
    sections:
      - section_id: SENTINEL-STATUS
        section_path: Overview > Development status
        claim_status: source_status_conflict
        content: |-
          The dedicated Sentinel Prime AI page says that features,
          specifications, requirements, and performance figures are design
          targets under active development and are not commercially validated
          claims. The InGen homepage separately labels Sentinel Prime AI as
          operational. Until the relationship between an existing operational
          system and the newer product version is confirmed, answers should
          report both current official statements rather than choose one
          unqualified status.
      - section_id: SENTINEL-GOVERNANCE
        section_path: Platform architecture > Uncertainty and human decision
        claim_status: design_intent
        content: |-
          The public design describes a Sense, Classify, Gate, and Act flow.
          Multi-sensor and model outputs pass through an uncertainty gate before
          becoming an operator alert. If the system is uncertain, the design
          suppresses or delays the alert rather than presenting the detection
          as confirmed. Human override is intended to remain available: the
          system advises and a human operator decides. Numerical performance
          values on the page are targets and are deliberately excluded from
          this benchmark knowledge base.
      - section_id: SENTINEL-PRIVACY
        section_path: UX and workflow > Privacy, escalation, and audit
        claim_status: design_intent
        content: |-
          Privacy zones are intended to appear as immutable overlays that an
          ordinary operator cannot disable. Biometric handling is described as
          match-and-forget without persistent storage of non-matched faces.
          Operator decisions and escalations are intended to be logged with
          identity, timestamp, uncertainty, and evidence information. Evidence
          export is intended to preserve privacy masking and an auditable
          integrity trail.

