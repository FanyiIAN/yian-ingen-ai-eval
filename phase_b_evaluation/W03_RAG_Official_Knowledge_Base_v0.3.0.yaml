    authority: current_official_page
    canonical_priority: 100
    is_current: true
    source:
      kind: official_web_curated_snapshot
      locator: https://www.ingendynamics.com/
      domain: www.ingendynamics.com
      accessed_at: "2026-07-26"
      curation_method: human_curated_paraphrase
    supported_facts:
      - fact_id: HOME-F1
        section_id: HOME-STATUS
        text: The homepage labels Fari and Senpai as in development.
      - fact_id: HOME-F2
        section_id: HOME-STATUS
        text: The homepage labels Sentinel Prime AI as operational.
      - fact_id: HOME-F3
        section_id: HOME-ORIGAMI
        text: Origami AI is described as the shared intelligence layer across InGen products.
      - fact_id: HOME-F4
        section_id: HOME-ROADMAP
        text: Product capabilities are at different development stages and forward-looking descriptions reflect design intent.
    sections:
      - section_id: HOME-STATUS
        section_path: Products > Current status labels
        claim_status: current_public_statement
        content: |-
          The current InGen Dynamics homepage presents a product ecosystem with
          explicit stage labels. Fari, the eldercare companion, and Senpai, the
          educational companion, are labelled In Development. Sentinel Prime AI
          is presented on the homepage as Operational. Aido Rover and Aido
          Humanoid are shown at Research Stage, while Origami AI is shown as In
          Development. These labels describe the homepage as accessed on
          2026-07-26 and should not be generalized to a different product
          version without checking that product's dedicated page.
      - section_id: HOME-ORIGAMI
        section_path: Product ecosystem > Origami AI
        claim_status: design_intent
        content: |-
          Origami AI is described as the shared intelligence or application
          layer powering the InGen product ecosystem. The stated design idea is
          "one brain, many bodies": knowledge developed in one product context
          may enrich another product. This is a high-level public architecture
          description. It does not establish that every proposed module is
          deployed in every product, and it does not provide an authoritative
          product-to-PIC module implementation matrix.
      - section_id: HOME-ROADMAP
        section_path: Our approach > Roadmap and qualification
        claim_status: forward_looking
        content: |-
          The roadmap sequences products by increasing physical complexity,
          from tabletop and companion systems to mobile platforms and longer
          term humanoid or platform ambitions. The homepage explicitly says
          that forward-looking product descriptions reflect design intent and
          that capabilities are in various stages of development. Roadmap
          language therefore must not be rewritten as a claim that every
          feature is complete, validated, commercially available, or deployed.

  - document_id: INGEN-OFFICIAL-FARI-20260726
    platform: Fari
    title: Fari Eldercare Companion - Public Design Intent
    document_type: official_web_curated_snapshot
    version: accessed-2026-07-26
    public_safe: true
    owner_type: official
    owner_id: ingen_dynamics
    access_scope: public
    confidentiality: public
    publisher: InGen Dynamics
    authority: current_official_product_page
    canonical_priority: 110
    is_current: true
    conflict_group: fari_rule_ids_official_vs_deferred_internal
    source:
      kind: official_web_curated_snapshot
      locator: https://www.ingendynamics.com/fari.html
      domain: www.ingendynamics.com
      accessed_at: "2026-07-26"
      curation_method: human_curated_paraphrase
    supported_facts:
      - fact_id: FARI-F1
        section_id: FARI-DEVELOPMENT
        text: Fari is in active development and described capabilities are design targets.
      - fact_id: FARI-F2
        section_id: FARI-AUTHORITY
        text: Fari recommendations are advisory and qualified humans authorize clinical actions.
      - fact_id: FARI-F3
        section_id: FARI-AUTHORITY
        text: Medication interactions require escalation and caregiver notification for missed doses.
      - fact_id: FARI-F4
        section_id: FARI-AUTHORITY
        text: Fari uses observation framing and should not pathologize a resident.
      - fact_id: FARI-F5
        section_id: FARI-PRIVACY
        text: Only clinically justified data should be collected and ambient recording is excluded.
      - fact_id: FARI-F6
        section_id: FARI-PRIVACY
        text: Camera and biometric processing is described as edge-first, without raw biometric transmission to the cloud.
      - fact_id: FARI-F7
        section_id: FARI-PRIVACY
        text: Family data sharing requires explicit, opt-in, revocable, granular consent.
      - fact_id: FARI-F8
        section_id: FARI-DIAGNOSIS
        text: Fari observes, reports, and suggests but does not diagnose.
      - fact_id: FARI-F9
        section_id: FARI-FAILURE
        text: AI decisions are intended to have timestamped audit records with confidence and rule checks.
      - fact_id: FARI-F10
        section_id: FARI-FAILURE
        text: On sensor or connectivity failure, Fari is intended to retain core safety functions and alert staff.
    sections:
      - section_id: FARI-DEVELOPMENT
        section_path: Overview > Development notice
        claim_status: design_intent
        content: |-
          The official Fari page states that Fari is in active development and
          is not yet commercially available. Features, specifications,
          performance figures, compliance language, and capabilities on the
          page are design targets or engineering intentions subject to change.
          They are not guarantees of future performance, regulatory approval,
          clinical validation, or commercial availability. Answers grounded in
          this page must preserve that qualification.
      - section_id: FARI-AUTHORITY
        section_path: SEOM framework > Human authority, medication, and dignity
        claim_status: design_intent
        content: |-
          Fari's public design principles place qualified human authority above
          autonomous clinical action. AI recommendations are advisory, and a
          qualified human must authorize clinical actions. Medication
          interactions are designed to use an escalation process with caregiver
          notification for missed doses; the page does not authorize Fari to
          prescribe or independently change a dose. Resident-facing language is
          intended to preserve dignity and describe observations rather than
          pathologizing a person. Recommendations should be visibly
          distinguished from confirmed information, with confidence shown to
          the human user.
      - section_id: FARI-PRIVACY
        section_path: SEOM framework > Data minimisation, privacy, and consent
        claim_status: design_intent
        content: |-
          The Fari page describes data minimisation: collect only information
          that is clinically justified and do not perform ambient recording.
          Camera feeds are intended to be processed on the device rather than
          stored, and raw biometric data is not intended to be transmitted to
          the cloud. Family data sharing requires explicit opt-in consent that
          can be revoked. Consent is granular: each data type and each sharing
          recipient requires a separate choice, so blanket permission is not
          sufficient. These statements describe intended privacy architecture,
          not an independently audited implementation.
      - section_id: FARI-DIAGNOSIS
        section_path: SEOM framework > No diagnosis
        claim_status: design_intent
        content: |-
          Fari is designed to observe, report, and suggest, but never diagnose.
          Health-related outputs should be framed as observations for review by
          a qualified human. A response must not convert a sensor reading or
          behavioural signal into a medical diagnosis, independently recommend
          a treatment change, or imply that the system has clinical authority.
      - section_id: FARI-FAILURE
        section_path: SEOM framework > Audit and graceful degradation
        claim_status: design_intent
        content: |-
          The public design intent calls for each AI decision to be logged with
          a timestamp, confidence information, relevant inputs, and safety-rule
          checks. If a sensor fails or connectivity is lost, Fari is intended
          to degrade gracefully: retain core safety functions and alert staff
          rather than silently continuing as if all inputs were reliable.

