    candidate_model_revision: 63a8b081895390a26e140280378bc85ec8bce07a
    tokenizer_revision: 63a8b081895390a26e140280378bc85ec8bce07a
    local_model_directory: /workspace/models/mistral_7b_instruct_v0_2
    runtime_adapter: fold_system_into_user
    precision: bfloat16
    judge_independent_from_candidate: false
  - candidate_model_key: llama31_8b_instruct
    candidate_model_id: meta-llama/Llama-3.1-8B-Instruct
    candidate_model_revision: 0e9e39f249a16976918f6564b8830bc894c89659
    tokenizer_revision: 0e9e39f249a16976918f6564b8830bc894c89659
    local_model_directory: /workspace/models/llama_3_1_8b_instruct
    runtime_adapter: native_chat
    precision: bfloat16
    judge_independent_from_candidate: true

evaluation:
  primary_dimensions:
    - answer_relevance
    - faithfulness
    - context_coverage
  judge:
    provider: local_vllm_litellm
    model_id: mistralai/Mistral-7B-Instruct-v0.2
    model_revision: 63a8b081895390a26e140280378bc85ec8bce07a
    local_model_directory: /workspace/models/mistral_7b_instruct_v0_2
    endpoint: http://127.0.0.1:8000/v1
    network_scope: loopback_only
    external_api_calls: false
    independent_from_candidate: true
    calibration_required: true
    result_status_until_calibrated: provisional
    self_judge_limitation: >-
      Mistral candidate rows are not independent from the shared Mistral Judge
      and must be reported separately as self-judge diagnostics.
  answer_relevance_embedding:
    provider: local_huggingface
    model_id: BAAI/bge-m3
    model_revision: 5617a9f61b028005a4858fdac845db406aefb181
    local_model_directory: /workspace/models/bge_m3
    external_api_calls: false
  human_confirmation:
    required_point_coverage: true
    forbidden_point_review: true
    model_blind_review: true

iteration_policy:
  run_id: w03-official-rag-multimodel-v0.5.0-blind-seed42
  immutable_run_directory: true
  never_overwrite_previous_outputs: true
  semantic_prompt_identical_across_candidates: true
  model_specific_serialization_only: true
  run_once_before_inspection: true
  no_prompt_tuning_on_blind_outputs: true

claim_boundary: >-
  Three-model public-data RAG component proxy. Base-versus-RAG deltas are the
  primary result; automatic cross-model rankings are provisional and do not
  measure deployed InGen product behavior.
