run_contract_version: 0.4.0
created_date: 2026-07-27
pipeline_stage: prompt_only_coverage_plan_development_iteration
random_seed: 42
evaluation_set: W03_RAG_Official_Eval_Set_v0.3.0.yaml#0.3.0
knowledge_base: W03_RAG_Official_Knowledge_Base_v0.3.0.yaml#0.3.0

comparison:
  conditions: [rag]
  expected_evaluation_items: 12
  expected_generation_rows: 12
  parent_run_id: w03-official-rag-v0.3.1-prompt-seed42
  comparison_target: parent_rag_rows_only
  fixed_variables:
    - candidate_model_id_and_revision
    - tokenizer_revision
    - question
    - retrieved_contexts_and_ranks
    - metadata_filters
    - decoding_configuration
    - random_seed
    - hardware_and_batch_size
    - latency_measurement_boundary
  manipulated_variable: rag_system_prompt_coverage_plan

retrieval_provenance:
  inherited_byte_for_byte_from_parent_inputs: true
  parent_config: W03_RAG_Official_Run_Config_v0.3.1.yaml#0.3.1

generation:
  framework: huggingface_transformers
  candidate_model_id: meta-llama/Llama-3.1-8B-Instruct
  candidate_model_revision: 0e9e39f249a16976918f6564b8830bc894c89659
  tokenizer_revision: 0e9e39f249a16976918f6564b8830bc894c89659
  local_model_directory: /workspace/models/llama_3_1_8b_instruct
  prompt_version: 0.4.0
  prompt_change: >-
    Replace accumulated global checklist instructions with one coverage-first
    planning rule adapted from Retrieve-Plan-Generation: silently decompose
    only explicit question parts, select minimal supporting evidence, answer
    every supported part once, omit unrelated context, and preserve epistemic
    polarity.
  max_input_tokens: 8192
  decoding:
    do_sample: false
    temperature: null
    top_p: null
    max_new_tokens: 384
  target_runtime: RunPod_A40_48GB
  precision: bfloat16

evaluation:
  primary_dimensions:
    - required_point_coverage
    - faithfulness
    - answer_relevance
  automatic_results_status: provisional_pending_human_calibration

iteration_policy:
  run_id: w03-official-rag-v0.4.0-coverage-plan-dev-seed42
  immutable_run_directory: true
  never_overwrite_previous_outputs: true
  one_variable_only: rag_system_prompt_coverage_plan
  development_disclosure: >-
    All 12 items have been inspected in prior iterations and are development
    regression cases only.
  regression_gates:
    - restore_SENPAI_005_weighted_point_coverage_to_at_least_4_of_5
    - do_not_restore_FARI_002_reapproval_inference
    - express_FARI_005_as_not_established_or_not_guaranteed
    - avoid_unasked_context_in_FARI_002
  keep_rule: >-
    Freeze this prompt for one untouched blind-set run only if every qualitative
    gate passes. Do not tune it using blind-set outputs.

claim_boundary: >-
  This is development evidence over inspected public-data proxy items, not a
  blind performance estimate or deployed-product evaluation.
